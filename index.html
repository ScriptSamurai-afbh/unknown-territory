<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unknown Territory — en ligne</title>
<style>
:root{
  --night:#0C100E; --panel:#151E17; --panel2:#1B261C; --line:#2C3A2E;
  --bone:#EDE9DC; --dim:#94A38D; --amber:#E5A94A; --lichen:#86B36B; --rust:#C0563C; --ice:#82A8B6;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Helvetica Neue",Arial,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--bone);font-family:var(--sans);font-size:15.5px;line-height:1.5}
#app{max-width:1120px;margin:0 auto;padding:14px 14px 40px}
h1{margin:0;font-size:30px;letter-spacing:.3em;text-transform:uppercase;font-weight:700}
h2{margin:0;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);font-weight:700}
h3{margin:0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:700}
p{margin:6px 0}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.note{font-size:13px;color:var(--dim)}
.mono{font-family:var(--mono)}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);padding:14px}
.card + .card{margin-top:0}
.sub{background:var(--panel2);border:1px solid var(--line);padding:10px}

button{font-family:var(--sans);font-size:14px;background:var(--panel2);color:var(--bone);
  border:1px solid var(--line);padding:10px 14px;cursor:pointer;text-align:left}
button:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.primary{background:var(--amber);color:#101610;border-color:var(--amber);font-weight:700;text-align:center}
.primary:hover:not(:disabled){background:#f2bc63;color:#101610}
.ghost{background:transparent}
.wide{width:100%}
.mini{font-size:12px;padding:4px 8px}

.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;border:1px solid var(--line);
  padding:3px 9px;border-radius:20px;color:var(--dim);white-space:nowrap}
.pill.on{border-color:var(--lichen);color:var(--lichen)}
.pill.off{border-color:var(--rust);color:var(--rust)}
.pill.hot{border-color:var(--amber);color:var(--amber)}
.pill.sel{background:var(--amber);color:#101610;border-color:var(--amber);cursor:pointer}
.pill.pick{cursor:pointer}

/* ---- barre du haut ---- */
#top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
#clock{font-family:var(--mono);font-size:34px;line-height:1;letter-spacing:.04em}
#clock.warn{color:var(--amber)} #clock.crit{color:var(--rust);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.crew{display:flex;gap:6px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:5px 9px;font-size:12.5px}
.who.now{border-color:var(--amber)}
.who .av{width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px}
.who.now .av{background:var(--amber);color:#101610;border-color:var(--amber)}
.who .hp{font-size:11px;color:var(--rust)}
.who.gone{opacity:.55}

/* ---- colonnes ---- */
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}

/* ---- carte ---- */
#mapBox{background:radial-gradient(ellipse at 35% 25%,#17211A 0%,#0E1310 62%,#0B0F0C 100%);
  border:1px solid var(--line);overflow:hidden}
svg.topo{display:block;width:100%;height:auto}
.contour{fill:none;stroke:#1E2A20;stroke-width:.8}
.edge{stroke:#3B4B38;stroke-width:1.3;stroke-dasharray:4 4}
.edge.fresh{stroke:var(--lichen);stroke-dasharray:none}
.node circle{fill:#111A13;stroke:#4C5D46;stroke-width:1.4}
.node text{font-family:var(--mono);font-size:3.1px;fill:var(--bone);text-anchor:middle;letter-spacing:.1px}
.node.seen circle{fill:#19241A}
.node.go circle{stroke:var(--lichen);stroke-width:2}
.node.go{cursor:pointer}
.node.go:hover circle{stroke:var(--amber);fill:#241C0C}
.node.shut circle{stroke:#6B4034;stroke-dasharray:2.5 2.5}
.node.shut text{fill:#9C8378}
.node.far{opacity:.5}
.node.here circle{stroke:var(--amber);stroke-width:2.6;fill:#2A200D}
.pin{font-family:var(--mono);font-size:3.2px;fill:var(--ice);text-anchor:middle}
.warn{font-size:3px;fill:var(--rust);text-anchor:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--dim)}
.legend b{color:var(--bone);font-weight:400}

/* ---- tour ---- */
.dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border:1px solid var(--line);border-radius:50%}
.dot.full{background:var(--amber);border-color:var(--amber)}
.act{border:1px solid var(--line);padding:10px;margin-top:8px;background:var(--panel2)}
.act.can{border-left:3px solid var(--lichen)}
.act.cant{opacity:.62}
.act .ttl{font-size:14.5px;font-weight:700}
.act .why{font-size:12px;color:var(--rust);margin-top:4px}
.inv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.item{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:5px 8px;font-size:13px}
.item .g{color:var(--amber)}
.goal{border-left:3px solid var(--line);background:var(--panel2);padding:9px 11px;margin-top:8px}
.goal.done{border-left-color:var(--lichen)}
.goal.fresh{border-left-color:var(--rust);animation:pop 1.2s 3}
@keyframes pop{50%{background:#2C1811}}
.goal .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.goal .pts{font-family:var(--mono);font-size:12px;color:var(--amber)}
.feed{list-style:none;margin:8px 0 0;padding:0;font-size:12.5px;max-height:150px;overflow:auto}
.feed li{padding:5px 0;border-top:1px solid #222D22;color:var(--dim)}

/* ---- fenêtres ---- */
.veil{position:fixed;inset:0;background:rgba(8,11,9,.97);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:60}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);padding:20px}
.seal{text-align:center;padding:34px 16px;border:1px dashed #4C5D46;margin:14px 0}
.seal .name{font-family:var(--mono);font-size:42px;letter-spacing:.18em;color:var(--amber);margin:12px 0 4px}
.bar{height:6px;background:#26301F;margin:12px 0 6px}
.bar > div{height:100%;background:var(--amber);transition:width .25s linear}
.count{font-family:var(--mono);font-size:26px;text-align:center;margin-bottom:12px}
.count.low{color:var(--rust)}
.quest{background:var(--panel2);border:1px solid var(--line);padding:12px;white-space:pre-line;
  font-size:14px;margin-bottom:6px}
.grid{display:grid;gap:8px}
.cell{font-family:var(--mono);font-size:17px;text-align:center;padding:14px 6px;background:var(--panel2);
  border:1px solid var(--line);cursor:pointer;user-select:none}
.cell:hover{border-color:var(--amber)}
.cell.big{font-size:23px;padding:18px 6px}
.cell.sel{border-color:var(--amber);background:#2E2716;color:var(--amber)}
.cell.ok{border-color:var(--lichen);color:var(--lichen)}
.cell.bad{border-color:var(--rust);color:var(--rust)}
.cell.txt{font-family:var(--sans);font-size:13.5px;text-align:left;padding:11px 12px}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0 0}
.steps li{counter-increment:s;position:relative;padding:7px 0 7px 30px;font-size:14px;border-top:1px solid #222D22}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;font-family:var(--mono);font-size:11px;
  color:var(--amber);border:1px solid var(--line);width:20px;height:20px;display:grid;place-items:center}
.rank{display:flex;justify-content:space-between;font-family:var(--mono);font-size:16px;padding:9px 0;border-top:1px solid var(--line)}
.rank.first{color:var(--amber)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- ajouts version en ligne ---- */
.code-big{font-family:var(--mono);font-size:46px;letter-spacing:.24em;color:var(--amber);text-align:center;margin:10px 0}
input{font-family:var(--mono);font-size:18px;background:var(--panel2);color:var(--bone);border:1px solid var(--line);
  padding:11px 12px;width:100%;letter-spacing:.12em}
input:focus{outline:none;border-color:var(--amber)}
label{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.lobby-p{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #222D22}
.lobby-p .av{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:12px}
.who .rd{font-size:10px;color:var(--lichen)}
.banner{border:1px solid var(--amber);background:#241C0C;padding:10px 12px;font-size:13.5px}
.banner.bad{border-color:var(--rust);background:#251310}
.hard{border-color:var(--rust)!important}
.hard .count{color:var(--rust)}
.tier{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase}
.tier.t1{color:var(--lichen)} .tier.t2{color:var(--ice)} .tier.t3{color:var(--amber)} .tier.t4{color:var(--rust)}
.reflex{height:150px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);
  font-size:19px;cursor:pointer;user-select:none}
.reflex.go{background:#1F3A22;border-color:var(--lichen);color:var(--lichen)}
.reflex.miss{background:#2A1512;border-color:var(--rust);color:var(--rust)}
.wait{opacity:.6;font-size:13px}
.mem-cell{transition:none}

/* ---- retours visuels ---- */
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ring{0%,100%{stroke-width:1.6}50%{stroke-width:3.6}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes flashfade{0%{opacity:0}12%{opacity:1}70%{opacity:1}100%{opacity:0}}
.who .busy{font-size:10px;color:var(--amber);animation:breathe 1.2s infinite}
.node.ping circle{stroke:var(--amber);animation:ring 1.1s infinite}
.node.moved circle{stroke:var(--ice)}
.node.here circle{animation:breathe 2.6s infinite}
.sheet{animation:rise .18s ease-out}
.cell.bad{animation:shake .3s}
.flash{position:fixed;inset:0;display:grid;place-items:center;z-index:120;pointer-events:none;
  font-family:var(--mono);font-size:34px;letter-spacing:.22em;text-align:center;animation:flashfade 1.1s forwards}
.flash.ok{background:rgba(24,58,30,.92);color:var(--lichen)}
.flash.no{background:rgba(64,22,18,.92);color:var(--rust)}
.flash small{display:block;font-size:13px;letter-spacing:.1em;color:var(--bone);margin-top:10px;opacity:.85}
.chat{list-style:none;margin:8px 0 0;padding:0;font-size:13px;max-height:160px;overflow:auto}
.chat li{padding:4px 0;border-top:1px solid #222D22}
.chat b{color:var(--amber);font-weight:400}
.chat .mine b{color:var(--ice)}
.chatbar{display:flex;gap:6px;margin-top:8px}
.chatbar input{flex:1;font-size:14px;letter-spacing:0;padding:8px 10px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.quick .pill{cursor:pointer}
.quick .pill:hover{border-color:var(--amber);color:var(--amber)}

/* ---- traversée à tracer ---- */
svg.topo{touch-action:none}
.grip{fill:none;stroke:var(--lichen);stroke-width:.5;stroke-dasharray:1.6 1.6;animation:breathe 2.2s infinite}
.tline{stroke:#3B4B38;stroke-width:2.8;stroke-linecap:round}
.tprog{stroke:var(--amber);stroke-width:2.8;stroke-linecap:round}
.tprog.off{stroke:var(--rust)}
.tdot{fill:var(--amber);stroke:#101610;stroke-width:.4}
.tdot.off{fill:var(--rust)}
.tlabel{font-family:var(--mono);font-size:2.8px;fill:var(--bone);text-anchor:middle;letter-spacing:.1px}
.tlabel.off{fill:var(--rust)}
.hint{font-family:var(--mono);font-size:2.6px;fill:var(--lichen);text-anchor:middle;letter-spacing:.1px}

/* ================= tableau de contrôle vivant ================= */
:root{ --p0:#E5A94A; --p1:#82A8B6; --p2:#86B36B; --p3:#C0563C; }
/* --- zones --- */
.node circle{transition:r .2s ease, stroke-width .2s ease, fill .6s ease, stroke .6s ease}
.node.go{cursor:grab}
.node.go:hover circle{r:3.5;stroke:var(--amber)}
.node.go:hover text{fill:var(--amber)}
.node.shut circle{animation:tremble 5s infinite}
@keyframes tremble{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(.35px,-.25px)}
  95%{transform:translate(-.35px,.25px)}97%{transform:translate(.25px,.2px)}}
.node.shut{transform-box:fill-box;transform-origin:center}
.node.dim circle{fill:#0D110E;stroke:#33402F}
/* --- connexions --- */
.edge{transition:stroke .9s ease, opacity .9s ease}
.edge.blocked{stroke:#6E3A30;opacity:.75}
.edge.storm{stroke:#8A4A32;animation:dashmove 1.1s linear infinite}
.edge.fresh{stroke:var(--lichen);stroke-dasharray:70;stroke-dashoffset:70;animation:draw 1.4s ease forwards}
.edge.used{stroke:var(--lichen);opacity:.9;animation:fadeback 4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dashmove{to{stroke-dashoffset:-16}}
@keyframes fadeback{to{stroke:#3B4B38;opacity:1}}
/* --- marqueurs de joueur --- */
.mk{transition:opacity .4s ease}
.mk .halo{fill:none;stroke-width:.35;opacity:.9;animation:breathe 2.4s infinite}
.mk .ring{fill:none;stroke-width:.4;stroke-dasharray:1.6 1.6;transform-box:fill-box;transform-origin:center;
  animation:spin 1.8s linear infinite}
.mk.call .body{animation:blinkfast .5s steps(2,end) infinite}
.mk.done .body{animation:glow 1s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blinkfast{50%{opacity:.15}}
@keyframes glow{from{r:2.6;opacity:.4}to{r:1.3;opacity:1}}
/* --- ambiance --- */
.contour{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{opacity:.45}to{opacity:1}}
.scan{stroke:var(--lichen);stroke-width:.35;opacity:.14;animation:sweep 9s linear infinite}
@keyframes sweep{0%{transform:translateY(-6px)}100%{transform:translateY(112px)}}
#mapBox{transition:filter 1.4s ease}
#mapBox.off{filter:saturate(.55) brightness(.82)}
#mapBox{position:relative}
#zoneTip{position:absolute;pointer-events:none;background:rgba(10,14,11,.94);border:1px solid var(--line);
  padding:8px 10px;font-size:12px;max-width:220px;opacity:0;transition:opacity .15s;z-index:5}
#zoneTip.on{opacity:1}
#zoneTip b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--amber);margin-bottom:3px}
/* --- urgence --- */
body.urgent #clock{animation:blink .7s infinite}
body.urgent .contour{animation-duration:6s}
body.urgent #mapBox{box-shadow:inset 0 0 40px rgba(192,86,60,.25)}
/* --- glisser-déposer --- */
.item{cursor:grab;touch-action:none;transition:transform .12s ease, border-color .2s}
.item:active{cursor:grabbing}
.item.dragging{opacity:.35}
#ghost{position:fixed;z-index:200;pointer-events:none;background:var(--panel2);border:1px solid var(--amber);
  color:var(--amber);padding:6px 10px;font-size:13px;font-family:var(--mono);transform:translate(-50%,-50%)}
.drop{border:1px dashed var(--line);padding:8px;transition:border-color .15s, background .15s}
.drop.hot{border-color:var(--amber);background:#241C0C}
.drop .who{border:0;padding:2px 0}
/* --- leviers --- */
.lever{position:relative;overflow:hidden;user-select:none;touch-action:none;cursor:pointer;
  border:1px solid var(--line);background:var(--panel2);padding:12px;text-align:center;font-size:13.5px}
.lever .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(229,169,74,.22);transition:width .06s linear}
.lever .lbl{position:relative}
.lever.ready{border-color:var(--lichen);color:var(--lichen)}
.lever.off{opacity:.45;cursor:not-allowed}
/* --- épreuves manipulées --- */
.dial{width:190px;height:190px;margin:0 auto;position:relative;touch-action:none}
.slider{height:44px;background:var(--panel2);border:1px solid var(--line);position:relative;touch-action:none;margin-bottom:8px}
.slider .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--lichen);opacity:.8}
.slider .knob{position:absolute;top:3px;bottom:3px;width:26px;background:var(--amber);cursor:grab}
.slider .val{position:absolute;right:8px;top:12px;font-family:var(--mono);font-size:13px;color:var(--dim)}
.band{height:54px;background:var(--panel2);border:1px solid var(--line);position:relative;touch-action:none}
.band .zone{position:absolute;top:0;bottom:0;background:rgba(134,179,107,.25);border-left:1px solid var(--lichen);
  border-right:1px solid var(--lichen)}
.band .grip{position:absolute;top:4px;bottom:4px;width:14px;background:var(--amber)}
.band.bad .grip{background:var(--rust)}
</style>
<div id="app"></div>
<script>
/* la bibliothèque réseau est tentée sur trois CDN : certains réseaux d'école en bloquent un */
window.PEER_STATE="chargement";
(function(){
  const srcs=["https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js",
              "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js",
              "https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"];
  let i=0;
  (function load(){
    if(i>=srcs.length){ window.PEER_STATE="bloqu\u00e9"; if(window.UI&&UI.render) UI.render(); return; }
    const sc=document.createElement("script"); sc.src=srcs[i++];
    sc.onload=()=>{ if(typeof Peer!=="undefined"){ window.PEER_STATE="ok"; if(window.UI&&UI.render) UI.render(); } else load(); };
    sc.onerror=load;
    document.head.appendChild(sc);
  })();
})();
</script>
<script>
"use strict";
/* ============ 1. OUTILS ============ */
let SEED = (Date.now() ^ (Math.random()*1e9)) >>> 0;
function rnd(){ SEED ^= SEED<<13; SEED>>>=0; SEED ^= SEED>>17; SEED ^= SEED<<5; SEED>>>=0; return SEED/4294967296; }
const ri = (a,b)=> a + Math.floor(rnd()*(b-a+1));
const pick = a => a[Math.floor(rnd()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(a,n){ return shuffle(a).slice(0,n); }
const el = (tag,cls,txt)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e;};
const $ = s => document.querySelector(s);
const fmt = s => String(Math.floor(Math.max(0,s)/60)).padStart(2,"0")+":"+String(Math.max(0,s)%60).padStart(2,"0");
const same = (a,b)=> JSON.stringify(a)===JSON.stringify(b);
/* ============ 2. DONNÉES DU MONDE ============ */

const ITEMS = {
  batterie:{n:"Batterie",g:"\u26A1"}, composant:{n:"Composant",g:"\u2699"}, materiau:{n:"Mat\u00e9riaux",g:"\u25A6"},
  outil:{n:"Outil",g:"\u2692"}, carburant:{n:"Carburant",g:"\u26FD"}, ration:{n:"Ration",g:"\u25A3"},
  medicament:{n:"M\u00e9dicament",g:"\u271A"}, donnees:{n:"Donn\u00e9es",g:"\u25A4"}, cle:{n:"Badge",g:"\u26BF"},
  artefact:{n:"Artefact",g:"\u25C8"}, echantillon:{n:"\u00c9chantillon",g:"\u2697"}, fragment:{n:"Fragment d'archive",g:"\u25B3"},
  combinaison:{n:"Combinaison",g:"\u2603"}, carte:{n:"Carte souterraine",g:"\u25F1"}
};
const iname = k => ITEMS[k].n;

/* ============ 3. CARTE ============ */
const ZONE_DEFS = [
  {id:"observatoire", n:"Observatoire",        x:20,y:11, adj:["foret"], hazard:0},
  {id:"meteo",        n:"Station m\u00e9t\u00e9o",   x:58,y:14, adj:["foret","labo"], hazard:0},
  {id:"foret",        n:"For\u00eat Nord",          x:36,y:27, adj:["observatoire","meteo","centre"], hazard:0},

/* connexit\u00e9 : un \u00e9boulement ne doit jamais isoler d\u00e9finitivement une zone */
function stillConnected(edges){
  const vis = ZONES.filter(z=>!z.hidden).map(z=>z.id);
  const seen=new Set(["camp"]), q=["camp"];
  while(q.length){ const z=q.pop();
    edges.forEach(e=>{ const o = e[0]===z? e[1] : e[1]===z? e[0] : null;
      if(o && vis.includes(o) && !seen.has(o)){ seen.add(o); q.push(o); } }); }
  return seen.size === vis.length;
}

/* ============ 3. BANQUE D'\u00c9PREUVES ============ */
/* Chaque \u00e9preuve est une donn\u00e9e : l'h\u00f4te fabrique {instr, ui, answer},
   n'envoie que {instr, ui} au joueur, et v\u00e9rifie la r\u00e9ponse re\u00e7ue.        */
const TIER_NAME = ["facile","moyenne","difficile","extr\u00eame"];
const TIER_SEC  = [50, 38, 26, 15];
const GL = ["\u25B3","\u25CB","\u25A1","\u2726","\u2318","\u25C7","\u2609","\u2325","\u25D0","\u2234"];
function nearOpts(ans, n, spread){
  const set=new Set([ans]); let guard=0;
  while(set.size<n && guard++<200){ const v=ans+ri(-spread,spread); if(v!==ans && v>=0) set.add(v); }
  while(set.size<n) set.add(ans+set.size);
  return shuffle([...set]);
}
function choiceNum(q, ans, spread){
  const opts = nearOpts(ans, 4, spread||Math.max(3,Math.round(Math.abs(ans)*0.4)+2));
  return { instr:q, ui:{type:"choice", options:opts.map(String)}, answer:opts.indexOf(ans) };
}
function choiceTxt(q, good, bads){
  const opts = shuffle([good,...bads]);
  return { instr:q, ui:{type:"choice", options:opts, wide:true}, answer:opts.indexOf(good) };
}

function evalTokens(tk){
  if(!Array.isArray(tk)||tk.length<3||tk.length%2===0) return null;
  const nums=[], ops=[];
  for(let i=0;i<tk.length;i++){
    if(i%2===0){ if(typeof tk[i]!=="number") return null; nums.push(tk[i]); }
    else { if(["+","-","\u00d7","\u00f7"].indexOf(tk[i])<0) return null; ops.push(tk[i]); } }
  let i=0;
  while(i<ops.length){
    if(ops[i]==="\u00d7"||ops[i]==="\u00f7"){ const a=nums[i], b=nums[i+1];
      if(ops[i]==="\u00f7" && (b===0 || a%b!==0)) return null;
      nums.splice(i,2, ops[i]==="\u00d7"? a*b : a/b); ops.splice(i,1); } else i++; }
  let v=nums[0];
  for(let k=0;k<ops.length;k++) v = ops[k]==="+"? v+nums[k+1] : v-nums[k+1];
  return v;
}

   const bank=SENTENCES.filter(x=>x[0]===Math.min(4,d)); const w=pick(bank.length?bank:SENTENCES)[1];
   return { instr:"Touchez les mots dans l'ordre pour reformer une phrase correcte en anglais.",
            ui:{type:"order", values:shuffle(w), words:true}, answer:w }; } },
 poursuite:{ name:"Garder le contact", make(d){
   const hold=[3,3.5,4,4.5][d-1], speed=[26,36,48,64][d-1], rad=[13,11,9,7][d-1];
   return { instr:"Gardez le doigt sur la cible pendant "+hold+" s cumul\u00e9es. Elle se d\u00e9place.",
            ui:{type:"chase", hold, speed, rad}, answer:"ok" }; } }

const POOLS = [
 ["suite","intrus","memoire","symboles","kang","anglais","molette","levier","binaire","tri","matrice","phrase"],
 ["kang","anglais","logique","ordre","cables","chemin","memoire","suite","calibrage","molette","levier",
  "binaire","tri","matrice","rappel","phrase","stroop","compte","poursuite"],
 ["kang","anglais","deduction","circuit","cables","reflexe","calibrage","levier","chemin","association",
  "stroop","compte","rappel","matrice","poursuite","binaire","tri","phrase"],
 ["kang","anglais","reflexe","memoire","cables","circuit","calibrage","levier","deduction",
  "stroop","compte","rappel","poursuite","matrice","phrase"]
];
function makePuzzle(tier, kind){
  tier = Math.max(1, Math.min(4, tier));
  kind = kind || pick(POOLS[tier-1]);
  const p = PZ[kind].make(tier);
  let sec = TIER_SEC[tier-1] + (G && G.pzBonus || 0) - (G && G.world.anomaly ? 6 : 0);
  if(p.ui.type==="memory") sec = Math.round(sec*0.8) + p.ui.seq.length*p.ui.speed/1000;
  if(p.ui.type==="reflex") sec = p.ui.rounds*3 + 8;
  if(p.ui.type==="lever")  sec = Math.round(p.ui.hold*3 + 10);
  if(p.ui.type==="cables") sec = Math.round(sec*1.15);
  if(p.ui.type==="chase")  sec = Math.round(p.ui.hold*3 + 9);
  if(p.ui.type==="stroop") sec = p.ui.list.length*3 + 6;
  if(p.ui.type==="recall") sec = Math.round(sec*0.8 + p.ui.show/1000);
  if(p.ui.type==="expr")   sec = Math.round(sec*1.2);
  if(p.ui.type==="bins")   sec = Math.round(sec*1.1);
  return { kind, tier, title:PZ[kind].name, instr:p.instr, ui:p.ui, answer:p.answer, seconds:Math.max(10,Math.round(sec)) };
}
/* v\u00e9rification c\u00f4t\u00e9 h\u00f4te */
function checkAnswer(pz, sub){
  if(pz.ui.type==="expr"){
    if(!Array.isArray(sub)) return false;
    const pool=pz.ui.nums.slice();
    for(let i=0;i<sub.length;i+=2){ const k=pool.indexOf(sub[i]); if(k<0) return false; pool.splice(k,1); }
    return evalTokens(sub)===pz.answer.target;
  }
  if(pz.ui.type==="dial")    return typeof sub==="number" && Math.abs(sub-pz.answer.target)<=pz.answer.tol;
  if(pz.ui.type==="sliders") return Array.isArray(sub) && sub.length===pz.answer.targets.length
                                    && sub.every((v,i)=>Math.abs(v-pz.answer.targets[i])<=pz.answer.tol);
  if(pz.ui.type==="switch"){
    if(!Array.isArray(sub)) return false;
    const st=pz.ui.start.slice();
    sub.forEach(i=>{ if(pz.ui.links[i]) pz.ui.links[i].forEach(j=>st[j]=!st[j]); });
    return st.every(v=>v);
  }
  if(pz.ui.type==="path"){
    if(!Array.isArray(sub) || !sub.length) return false;
    const g=pz.ui.grid, N=g.length;
    if(sub[0][0]!==0 || sub[0][1]!==0) return false;
    for(let i=0;i<sub.length;i++){ const [x,y]=sub[i];
      if(x<0||y<0||x>=N||y>=N||g[y][x]) return false;
      if(i){ const [px,py]=sub[i-1]; if(Math.abs(px-x)+Math.abs(py-y)!==1) return false; } }
    const last=sub[sub.length-1];
    return last[0]===N-1 && last[1]===N-1;
  }
  return same(pz.answer, sub);
}

/* ============ 4. MOTEUR (c\u00f4t\u00e9 h\u00f4te) ============ */
ACTIONS.push({ id:"porte_bunker", zone:"centre", n:"Forcer la porte du bunker", need:2, cost:{outil:1}, pz:2,

let G=null, ZONES=[], TICK=null, PZSEQ=0;

const zn = id => (ZONES.find(z=>z.id===id)||{n:id}).n;
const invCount = p => Object.values(p.inv).reduce((a,b)=>a+b,0);
function orderOK(p, seq){ let i=0; for(const z of p.visited){ if(z===seq[i]) i++; if(i===seq.length) return true; } return false; }
function give(p,it,n){ n=n||1; p.inv[it]=(p.inv[it]||0)+n; }
function take(p,it,n){ n=n||1; if((p.inv[it]||0)<n) return false; p.inv[it]-=n; if(!p.inv[it]) delete p.inv[it]; return true; }
function note(p,t){ p.notes.push(t); }
function damage(p,n){ if(p.dead) return; p.hp-=n; p.flags.damaged=true;
  if(p.hp<=0){ p.hp=0; p.dead=true; pub(p.name+" est \u00e0 terre. Un m\u00e9dicament peut le remettre debout."); } }
function drainEnergy(n){ G.world.energy-=n;
  if(G.world.energy<=0){ G.world.energy=0; G.world.power=false; G.world.labo_on=false; pub("Plus d'\u00e9nergie : le courant retombe."); } }
function addEdge(a,b){ if(!G.edges.some(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a))){
  G.edges.push([a,b]); G.newEdges.push(a+b); pub("Nouveau passage : "+zn(a)+" \u2013 "+zn(b)); } }
function reveal(id){ const z=ZONES.find(z=>z.id===id); if(z&&z.hidden){ z.hidden=false;
  Net.broadcast({t:"sfx", k:"coulisse", zone:id}); pub("Une zone appara\u00eet sur la carte : "+z.n); } }
function lockZone(id){ const z=ZONES.find(z=>z.id===id); if(z) z.sealed=true; }
function pub(t){ G.public.unshift("["+fmt(G.time)+"] "+t); if(G.public.length>40) G.public.pop(); }
function toast(t){ pub(t); }
function adjacents(id){ const out=[]; G.edges.forEach(e=>{ if(e[0]===id) out.push(e[1]); if(e[1]===id) out.push(e[0]); }); return out; }
function zoneOf(id){ return ZONES.find(z=>z.id===id); }
function playersIn(id){ return G.players.filter(p=>p.zone===id); }
function needOf(a){ return G.nP<3 ? Math.min(a.need,2) : a.need; }

const TUNE = {                       /* durée (min), actions par tour, densité du matériel */
  2:{ time:[30,26], ap:[6,5], loot:2.6 },
  3:{ time:[26,22], ap:[5,4], loot:3.2 },
  4:{ time:[30,26], ap:[4,3], loot:2.8 }
};
function newGame(names, easy){
  const nP=names.length, tu=TUNE[Math.max(2,Math.min(4,nP))], k=easy?0:1;
  ZONES = ZONE_DEFS.map(z=>({...z, loot:[], sealed:false}));
  G = { nP, easy, round:1, time:tu.time[k]*60, timeTotal:tu.time[k]*60, apBase:tu.ap[k],
        missionCount: easy?3:4, pzBonus: easy?10:0, hazardRisk: easy?0.15:0.28,
        players:[], edges:[], newEdges:[], doneActs:[], public:[], mut:0, endFlag:null, over:false,
        world:{energy:0,power:false,labo_on:false,comms:false,coffre:false,scelle:false,sas:false,reveil:false,
               neutralise:false,extraction:false,observatoire_open:false,mine_open:false,bunker_open:false,
               labo_unlocked:false,storm:0,anomaly:0,shield:false} };
  ZONES.forEach(z=> z.adj.forEach(a=>{ if(!G.edges.some(e=>(e[0]===z.id&&e[1]===a)||(e[0]===a&&e[1]===z.id))) G.edges.push([z.id,a]); }));
  const per=tu.loot*(easy?1.25:1);
  const pool=["batterie","composant","materiau","outil","carburant","ration","medicament","cle","combinaison","fragment"];
  ZONES.filter(z=>z.id!=="camp").forEach(z=>{ const n=Math.max(1,Math.round((rnd()*2+1)*per/3)); for(let i=0;i<n;i++) z.loot.push(pick(pool)); });
  zoneOf("camp").loot.push("ration","outil","materiau");
  zoneOf("labo").loot.push("donnees"); zoneOf("bunker").loot.push("cle"); zoneOf("centre").loot.push("fragment","cle");
  let bag=shuffle(MISSIONS.map(m=>m.id));
  names.forEach((nm,i)=>{
    const mine=[];
    for(const id of bag.slice()){
      if(mine.length===G.missionCount) break;
      if(mine.some(x=>CONFLICTS.some(c=>(c[0]===x&&c[1]===id)||(c[1]===x&&c[0]===id)))) continue;
      mine.push(id); bag=bag.filter(z=>z!==id);
    }
    const objs=mine.map(id=>MISSIONS.find(m=>m.id===id)).sort((a,b)=>b.w-a.w);
    const pts=[100,60,40,20];
    G.players.push({ id:i, name:nm, zone:"camp", hp:3, ap:0, inv:{ration:1}, dead:false, ready:false, notes:[],
      visited:["camp"], acts:[], coop:0, gifts:0, fails:0, journal:[], flags:{}, gaveThisTurn:0,
      missions:objs.map((m,k)=>({ref:m, pts:pts[k], mutated:false})) });
  });
  const st=["outil","batterie","materiau","composant"];
  G.players.forEach((p,i)=>{ give(p,st[i%st.length]); if(easy) give(p,"ration"); });
  startRound(true);
}
function startRound(first){
  G.players.forEach(p=>{ p.ap = p.dead? 2 : G.apBase; p.ready=false; p.gaveThisTurn=0; if(!first) checkMutations(p); });
}
function setReady(p){
  p.ready=true;
  const z=zoneOf(p.zone);
  if(!p.dead && z.hazard>0){
    if(z.hazard>=2 && !(p.inv.combinaison>0)){ damage(p,1); note(p,"Zone contamin\u00e9e sans combinaison : \u20131 point de vie."); }
    else if(z.hazard===1 && rnd()<G.hazardRisk){ damage(p,1); note(p,"Terrain instable : \u20131 point de vie."); }
  }
  if(G.players.every(q=>q.ready)) roundEnd();
}
function roundEnd(){
  G.round++; G.world.storm=0; G.world.anomaly=0;
  let ev=pick(EVENTS);
  if(ev.meteo && G.world.shield){ G.world.shield=false; ev={n:"Pr\u00e9vision confirm\u00e9e", txt:"La station avait vu venir : l'\u00e9v\u00e9nement est \u00e9vit\u00e9.", eff:()=>{}}; }
  ev.eff(G);
  const evSnd={tempete:"rafale", gel:"rafale", panne:"extinction", effondrement:"pierres",
               cache:"coulisse", anomalie:"notification", contamination:"fuite", reveil:"grondement", calme:"notification"};
  Net.broadcast({t:"sfx", k:evSnd[ev.id]||"notification", zone:null});
  pub("\u26A1 "+ev.n+" \u2014 "+ev.txt);
  Net.broadcast({t:"chat", from:"\u26A1 "+ev.n, id:-1, text:ev.txt});
  G.lastEvent=ev;
  startRound(false);
}
function checkMutations(p){
  if(G.mut>=3 || rnd()>0.3) return;
  for(const m of p.missions){
    if(m.mutated) continue;
    const rule=MUTATIONS.find(r=>r.from===m.ref.id && r.when(G));
    if(rule){ m.ref=rule.to; m.mutated=true; m.fresh=true; G.mut++;
      Net.toPlayer(p.id,{t:"mutation", title:rule.to.t.replace("NOUVEL OBJECTIF \u2014 ",""), desc:rule.to.d, pts:m.pts});
      return; }
  }
}
/* ---- d\u00e9placement / fouille / grandes actions ---- */
function canEnter(p,id){
  const z=zoneOf(id);
  if(!z||z.hidden) return {ok:false, why:"Zone inconnue."};
  if(z.sealed) return {ok:false, why:"Acc\u00e8s ferm\u00e9 d\u00e9finitivement."};
  if(!adjacents(p.zone).includes(id)) return {ok:false, why:"Trop loin."};
  if(id==="observatoire"&&!G.world.observatoire_open) return {ok:false, why:"\u00c9boulis : d\u00e9gagez la route depuis la For\u00eat Nord."};
  if(id==="labo"&&!G.world.labo_unlocked&&!(p.inv.cle>0)) return {ok:false, why:"Porte ferm\u00e9e : il faut un Badge."};
  if(id==="bunker"&&!G.world.bunker_open) return {ok:false, why:"Porte blind\u00e9e : forcez-la depuis le Centre abandonn\u00e9."};
  if(id==="structure"&&playersIn("complexe").length<Math.min(3,G.nP)) return {ok:false, why:"Le sas exige 3 explorateurs pr\u00e9sents dans le Complexe."};
  return {ok:true};
}
const moveCost = ()=> 1 + (G.world.storm?1:0);
function doMove(p,id){
  const r=canEnter(p,id);
  if(!r.ok) return note(p,r.why);
  if(p.ap<moveCost()) return note(p,"Il faut "+moveCost()+" action(s).");
  p.ap-=moveCost(); p.zone=id;
  if(!p.visited.includes(id)) p.visited.push(id);
  if(id==="labo") G.world.labo_unlocked=true;
}
function helpersFor(p){ return playersIn(p.zone).filter(q=>!q.dead && !q.ready && (q.id===p.id? q.ap>=2 : q.ap>=1)); }
function whyNot(p,a){
  if(p.dead) return "Vous \u00eates \u00e0 terre.";
  if(p.ap<2) return "Il faut 2 actions (il vous en reste "+p.ap+").";
  if(a.req&&!a.req(G)) return a.id==="descendre" ? "Le complexe est scell\u00e9." : "Il faut d'abord remettre le courant.";
  for(const k in (a.cost||{})) if((p.inv[k]||0)<a.cost[k]) return "Il vous manque : "+a.cost[k]+" \u00d7 "+iname(k);
  const n=helpersFor(p).length, need=needOf(a);
  if(n<need) return "Il faut "+need+" explorateurs pr\u00eats ici (vous \u00eates "+n+").";
  return null;
}
function tierOf(a){ let t=a.pz; if(rnd()<0.28) t=Math.min(4,t+1); if(rnd()<0.07) t=Math.min(4,t+1); return t; }
function askPuzzle(p, tier, kind, cb, extra){
  let pz=makePuzzle(tier,kind);
  for(let i=0;i<6 && !kind && pz.kind===p.lastKind; i++) pz=makePuzzle(tier);
  p.lastKind=pz.kind;
  const pid=++PZSEQ;
  PEND[p.id]={pid,pz,cb,deadline:Date.now()+(pz.seconds+4)*1000};
  Net.toPlayer(p.id,{t:"puzzle", pid, title:pz.title, instr:pz.instr, ui:pz.ui,
                     seconds:pz.seconds, tier:pz.tier, tag:extra||""});
}
function askCode(p, parts, cb){
  /* au moins 3 chiffres, même à deux : les chiffres sont répartis en alternance,
     personne ne voit le code entier. */
  const len=Math.max(3, parts.length);
  const code=Array.from({length:len},()=>ri(1,9));
  const digitsOf=q=>{ const out=[]; for(let i=0;i<len;i++) if(parts[i%parts.length].id===q.id) out.push({pos:i+1, value:code[i]}); return out; };
  parts.forEach(q=>{ if(q.id!==p.id) Net.toPlayer(q.id,{t:"digit", digits:digitsOf(q), total:len, from:p.name}); });
  const pid=++PZSEQ, secs=9*len+10;
  const pz={ui:{type:"code",len}, answer:code, seconds:secs, tier:1};
  PEND[p.id]={pid,pz,cb,deadline:Date.now()+(secs+4)*1000};
  const mine=digitsOf(p).map(dg=>"n\u00b0"+dg.pos+" = "+dg.value).join(", ");
  Net.toPlayer(p.id,{t:"puzzle", pid, title:"Code \u00e0 "+len+" chiffres", ui:pz.ui, seconds:secs, tier:1,
    instr:"Vous connaissez "+mine+".\nLes autres chiffres sont sur les \u00e9crans de vos \u00e9quipiers : demandez-les et tapez le code dans l'ordre."});
}
function submit(p,pid,value){
  const e=PEND[p.id]; if(!e||e.pid!==pid) return;
  delete PEND[p.id];
  const ok=checkAnswer(e.pz,value);
  Net.toPlayer(p.id,{t:"result", ok, code:e.pz.ui.type==="code"});
  e.cb(ok);
}
function timeoutPuzzles(){
  const now=Date.now();
  Object.keys(PEND).forEach(k=>{ const e=PEND[k]; if(now>e.deadline){ delete PEND[k];
    Net.toPlayer(+k,{t:"result", ok:false, late:true}); e.cb(false); } });
}
function doSearch(p){
  if(p.dead) return note(p,"Un explorateur \u00e0 terre ne peut pas fouiller.");
  if(p.ap<1) return note(p,"Plus assez d'actions.");
  if(PEND[p.id]) return;
  p.ap--;
  const z=zoneOf(p.zone);
  askPuzzle(p, rnd()<0.25?2:1, null, ok=>{
    if(ok){
      if(z.loot.length){ const it=z.loot.pop(); give(p,it); note(p,"Trouv\u00e9 : "+iname(it)); }
      else if(rnd()<0.45){ const it=pick(["materiau","ration","batterie"]); give(p,it); note(p,"Trouv\u00e9 : "+iname(it)); }
      else note(p,"Rien d'utile ici.");
      if(rnd()<0.45){ const c=pick(CLUES); p.journal.push(c); note(p,"Vous seul voyez \u00e7a : "+c); }
    } else { p.fails++; note(p,"Fouille rat\u00e9e."); }
    Net.pushAll();
  }, "Fouille de "+z.n);
}
function doAct(p,id){
  const a=ACTIONS.find(x=>x.id===id);
  if(!a || a.zone!==p.zone || G.doneActs.includes(id) || PEND[p.id]) return;
  const why=whyNot(p,a); if(why) return note(p,why);
  const parts=[p,...helpersFor(p).filter(q=>q.id!==p.id)].slice(0,needOf(a));
  for(const k in (a.cost||{})) take(p,k,a.cost[k]);
  p.ap-=2; parts.forEach(q=>{ if(q.id!==p.id) q.ap-=1; });
  const tier=tierOf(a);
  const finish=ok=>{
    if(ok){
      G.doneActs.push(a.id);
      parts.forEach(q=>{ q.acts.push(a.id); if(parts.length>1) q.coop++; if(G.time>G.timeTotal/2) q.flags.earlyAct=true; });
      a.eff(G,p);
      const snd = ["reactiver_centrale","alimenter_labo","comms","relais"].indexOf(a.id)>=0 ? "demarrage"
                : ["porte_bunker","coffre","descendre","sceller"].indexOf(a.id)>=0 ? "porte"
                : ["rouvrir_mine","deblayer_route","degager_eboulis"].indexOf(a.id)>=0 ? "pierres"
                : ["prelever"].indexOf(a.id)>=0 ? "fuite" : "validation";
      Net.broadcast({t:"sfx", k:snd, zone:p.zone});
      pub(a.n+" \u2014 par "+parts.map(q=>q.name).join(", "));
      checkMutations(p);
    } else {
      parts.forEach(q=>{ q.fails++; note(q,"\u00c9chec sur \u00ab "+a.n+" \u00bb."); });
      G.time-=15; pub("\u00c9chec : "+a.n+" (\u201315 s pour tout le monde)");
      Net.broadcast({t:"sfx", k:"erreur", zone:p.zone});
    }
    checkEnd(); Net.pushAll();
  };
  const run=()=> askPuzzle(p, tier, null, finish, a.n);
  if(parts.length>1) askCode(p, parts, ok=> ok? run() : finish(false));
  else run();
  Net.pushAll();
}
function doGive(p,toId,item){
  Net.broadcast({t:"sfx", k:(item==="batterie"?"batterie":item==="cle"?"cle":item==="donnees"||item==="fragment"?"papier":"pose"), zone:p.zone});
  const q=G.players.find(x=>x.id===toId);
  if(!q||q.zone!==p.zone) return;
  if(p.gaveThisTurn>=2) return note(p,"Deux dons maximum par tour.");
  if(!take(p,item)) return;
  give(q,item); p.gifts++; p.gaveThisTurn++;
  note(q,p.name+" vous donne : "+iname(item));
  pub(p.name+" donne "+iname(item)+" \u00e0 "+q.name);
}
function doMed(p,toId){
  const q=G.players.find(x=>x.id===toId);
  if(!q||q.zone!==p.zone||!take(p,"medicament")) return;
  p.flags.usedMed=true;
  if(q.dead){ q.dead=false; q.hp=1; pub(q.name+" est remis sur pied par "+p.name+"."); }
  else { q.hp=Math.min(3,q.hp+1); pub(q.name+" est soign\u00e9 par "+p.name+"."); }
}
function checkEnd(){ if(!G.over && (G.time<=0 || G.endFlag)){ endGame(); return true; } return false; }
function endGame(){
  G.over=true; G.time=Math.max(0,G.time);
  G.players.forEach(p=>{
    let s=0; p.detail=[];
    p.missions.forEach(m=>{ const ok=!!m.ref.c(p,G); if(ok) s+=m.pts;
      p.detail.push({t:m.ref.t, d:m.ref.d, ok, pts:ok?m.pts:0, mut:m.mutated}); });
    const bon=[];
    if(!p.dead){ s+=10; bon.push(["Survivant","+10"]); } else { s-=5; bon.push(["\u00c0 terre \u00e0 la fin","\u20135"]); }
    if(G.world.extraction&&p.zone==="camp"){ s+=15; bon.push(["Pr\u00e9sent au d\u00e9part","+15"]); }
    if(p.fails){ s-=2*p.fails; bon.push([p.fails+" \u00e9preuve(s) rat\u00e9e(s)","\u2013"+2*p.fails]); }
    p.bonus=bon; p.score=s;
  });
  Net.broadcast({t:"end", results:G.players.map(p=>({name:p.name, score:p.score, detail:p.detail, bonus:p.bonus,
    journal:p.journal})).sort((a,b)=>b.score-a.score), reason:G.endFlag||"Le chrono est \u00e9puis\u00e9."});
}
const CLUES = [

/* ---- vue envoy\u00e9e \u00e0 chaque joueur ---- */
function viewFor(p){
  const moves={};
  adjacents(p.zone).forEach(id=>{ const z=zoneOf(id); if(!z||z.hidden) return; moves[id]=canEnter(p,id); });
  return {
    round:G.round, time:G.time, apBase:G.apBase, nP:G.nP, easy:G.easy,
    world:G.world, feed:G.public.slice(0,8),
    zones:ZONES.filter(z=>!z.hidden).map(z=>({id:z.id,n:z.n,x:z.x,y:z.y,hazard:z.hazard,sealed:z.sealed})),
    edges:G.edges,
    players:G.players.map(q=>({id:q.id,name:q.name,zone:q.zone,hp:q.hp,dead:q.dead,ap:q.ap,ready:q.ready,busy:!!PEND[q.id]})),
    locked:ZONES.filter(z=>!z.hidden).reduce((a,z)=>{ a[z.id]=(z.sealed
      || (z.id==='observatoire'&&!G.world.observatoire_open)
      || (z.id==='labo'&&!G.world.labo_unlocked)
      || (z.id==='bunker'&&!G.world.bunker_open)); return a; },{}),
    ping:(G.ping && Date.now()-G.ping.at<30000)? {zone:G.ping.zone, name:G.ping.name} : null,
    moves,
    actions:ACTIONS.filter(a=>a.zone===p.zone&&!G.doneActs.includes(a.id)).map(a=>({
      id:a.id, n:a.n, desc:a.desc, need:needOf(a), tier:a.pz,
      cost:Object.keys(a.cost||{}).map(k=>a.cost[k]+" \u00d7 "+iname(k)).join(", "),
      why:whyNot(p,a) })),
    me:{ id:p.id, name:p.name, zone:p.zone, ap:p.ap, hp:p.hp, dead:p.dead, ready:p.ready, gave:p.gaveThisTurn,
         inv:Object.keys(p.inv).map(k=>({k, n:p.inv[k], g:ITEMS[k].g, name:iname(k)})),
         journal:p.journal.slice().reverse(),
         missions:p.missions.map(m=>({t:m.ref.t, d:m.ref.d, pts:m.pts, done:!!m.ref.c(p,G), mut:m.mutated})) },
    notes:(()=>{ const n=p.notes.slice(); p.notes.length=0; return n; })()
  };
}

/* ============ 5. R\u00c9SEAU (WebRTC via PeerJS) ============ */
const ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const mkCode = ()=> Array.from({length:4},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join("");
const PEER_CFG = { debug:0, config:{ iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"turn:openrelay.metered.ca:80",  username:"openrelayproject", credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443", username:"openrelayproject", credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443?transport=tcp", username:"openrelayproject", credential:"openrelayproject"}
]}};
const Net = {
  role:null, peer:null, code:null, conns:{}, slots:[], started:false, easy:true, error:null,
  toPlayer(id,msg){ if(id===0 && this.role==="host") return clientReceive(msg);
                    const c=this.conns[id]; if(c&&c.open){ try{ c.send(msg); }catch(e){} } },
  broadcast(msg){ (G? G.players : this.slots).forEach(p=>this.toPlayer(p.id,msg)); },
  pushAll(){ if(!G) return; G.players.forEach(p=>this.toPlayer(p.id,{t:"view", v:viewFor(p)})); },
  lobbyPush(){ const list=this.slots.map(s=>s.name);
    this.slots.forEach(s=>this.toPlayer(s.id,{t:"lobby", code:this.code, players:list, easy:this.easy, host:s.id===0})); },
  send(msg){ if(this.role==="host") return handleClient(0,msg);
             if(this.conn&&this.conn.open) this.conn.send(msg); },

  createRoom(name, done0){
    let called=false; const done=e=>{ if(called) return; called=true; done0(e); };
    if(typeof Peer==="undefined") return done("La biblioth\u00e8que r\u00e9seau n'est pas charg\u00e9e (r\u00e9seau bloqu\u00e9 ?). Rechargez la page.");
    this.role="host"; this.code=mkCode();
    this.slots=[{id:0,name:name||"H\u00d4TE"}];
    this.peer=new Peer("utr-"+this.code, PEER_CFG);
    this.peer.on("open", ()=>done(null));
    this.peer.on("error", e=>done("Connexion impossible ("+e.type+"). R\u00e9essayez."));
    this.peer.on("connection", c=>{
      c.on("data", m=>{
        if(m.t==="hello"){
          if(this.started || this.slots.length>=4){ c.send({t:"full"}); return; }
          const id=this.slots.length;
          this.slots.push({id, name:(m.name||"EXPLO").toUpperCase().slice(0,10)});
          this.conns[id]=c; c._pid=id;
          this.lobbyPush(); UI.render();
        } else if(c._pid!=null) handleClient(c._pid, m);
      });
      c.on("close", ()=>{ if(c._pid!=null && G) pub((this.slots[c._pid]||{}).name+" a perdu la connexion."); UI.render(); });
    });
  },
  joinRoom(code, name, done0){
    let called=false; const done=e=>{ if(called) return; called=true; done0(e); };
    if(typeof Peer==="undefined") return done("Impossible de charger la biblioth\u00e8que r\u00e9seau.");
    this.role="client"; this.code=code.toUpperCase().trim();
    this.peer=new Peer(PEER_CFG);
    this.peer.on("error", e=> done(e.type==="peer-unavailable" ? "Aucune partie avec ce code." : "Connexion impossible ("+e.type+")."));
    const giveUp=setTimeout(()=>done("La liaison n'a pas pu s'\u00e9tablir en 20 s. V\u00e9rifiez que l'h\u00f4te a bien gard\u00e9 son onglet ouvert ; si le probl\u00e8me persiste, essayez en partage de connexion mobile (certains r\u00e9seaux d'\u00e9cole bloquent ce type de liaison)."), 20000);
    this.peer.on("open", ()=>{
      UI.banner="Salle trouv\u00e9e, \u00e9tablissement de la liaison\u2026"; UI.render();
      this.conn=this.peer.connect("utr-"+this.code, {reliable:true});
      this.conn.on("open", ()=>{ clearTimeout(giveUp); this.conn.send({t:"hello", name}); done(null); });
      this.conn.on("data", clientReceive);
      this.conn.on("error", ()=>done("Erreur de liaison avec l'h\u00f4te."));
      this.conn.on("close", ()=>{ UI.banner="La connexion avec l'h\u00f4te est perdue."; UI.render(); });
    });
  }
};
/* ---- messages re\u00e7us par l'h\u00f4te ---- */
function handleClient(pid, m){
  if(m.t==="start" && pid===0 && !Net.started){
    if(Net.slots.length<2) return;
    Net.started=true;
    newGame(Net.slots.map(s=>s.name), Net.easy);
    Net.broadcast({t:"go"});
    Net.pushAll();
    if(!TICK) TICK=setInterval(hostTick,1000);
    return;
  }
  if(m.t==="mode" && pid===0 && !Net.started){ Net.easy=!!m.easy; Net.lobbyPush(); UI.render(); return; }
  if(!G || G.over) return;
  const p=G.players[pid]; if(!p) return;
  switch(m.t){
    case "move":   if(!PEND[p.id] && !p.ready) doMove(p,m.zone); break;
    case "search": if(!p.ready) doSearch(p); return;
    case "act":    if(!p.ready) doAct(p,m.id); return;
    case "give":   doGive(p,m.to,m.item); break;
    case "med":    doMed(p,m.to); break;
    case "ready":  if(!p.ready) setReady(p); break;
    case "answer": submit(p,m.pid,m.value); return;
    case "chat": {
      const txt=String(m.text||"").slice(0,140).trim(); if(!txt) return;
      if(m.ping){ G.ping={zone:p.zone, name:p.name, at:Date.now()}; }
      Net.broadcast({t:"chat", from:p.name, id:p.id, text:txt, ping:!!m.ping, zone:m.ping? zn(p.zone):null});
      break;
    }
  }
  Net.pushAll();
}
function hostTick(){
  if(!G||G.over) return;
  G.time--;
  timeoutPuzzles();
  if(checkEnd()) { clearInterval(TICK); TICK=null; return; }
  Net.pushAll();
}
/* ---- messages re\u00e7us par un joueur ---- */
function clientReceive(m){
  switch(m.t){
    case "lobby": UI.lobby=m; UI.screen="lobby"; UI.render(); break;
    case "go":    UI.screen="game"; break;
    case "view": {
      const v=m.v; (v.notes||[]).forEach(t=>UI.note(t));
      const key=JSON.stringify([v.round,v.players,v.me,v.actions,v.moves,v.feed,v.world,v.zones.length,v.edges.length,v.ping]);
      const prev=UI.V; UI.V=v;
      SND.setZone(v.me.zone, v.world);
      if(prev){
        if(!!prev.world.storm !== !!v.world.storm) SND.setStorm(!!v.world.storm);
        if(prev.world.power !== v.world.power) SND.setPower(v.world.power);
      }
      if(UI.travelling){ UI.tickClock(); UI.lastKey=null; break; }     /* trac\u00e9 en cours : on ne reconstruit pas */
      if(UI.screen==="game" && key===UI.lastKey){ UI.tickClock(); }   /* seul le chrono bouge */
      else { UI.lastKey=key; UI.screen=UI.screen==="end"?"end":"game"; UI.render(); }
      break;
    }
    case "result": UI.flash(m.ok, m.late, m.code); break;
    case "sfx": if(m.zone) SND.at(m.k, m.zone, UI.V); else SND.play(m.k); break;
    case "chat":  UI.chatIn(m); break;
    case "puzzle":UI.openPuzzle(m); break;
    case "digit": SND.play("relais"); UI.showDigit(m); break;
    case "mutation": SND.play("mission"); UI.showMutation(m); break;
    case "end":   SND.stopAmb(); SND.play("extinction"); UI.results=m; UI.screen="end"; UI.closeVeil(); UI.render(); break;
    case "full":  UI.banner="La partie est compl\u00e8te ou d\u00e9j\u00e0 lanc\u00e9e."; UI.render(); break;
  }
}


/* ============ 7. AMBIANCE SONORE ============
   Tout est synth\u00e9tis\u00e9 : aucun fichier audio, aucune musique de fond.
   Trois bus : ambiances (fond continu), effets (actions), ma\u00eetre.        */
const SND = {
  ctx:null, master:null, ambBus:null, sfxBus:null, ready:false,
  vol:{master:0.75, sfx:1, amb:0.55}, muted:false,
  noiseBuf:null, layers:[], timers:[], zone:null, mods:{},

  init(){
    if(this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value=this.vol.master;
    this.master.connect(this.ctx.destination);
    this.ambBus = this.ctx.createGain(); this.ambBus.gain.value=this.vol.amb; this.ambBus.connect(this.master);
    this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value=this.vol.sfx; this.sfxBus.connect(this.master);
    /* une seule r\u00e9serve de bruit, r\u00e9utilis\u00e9e par toutes les couches */
    const len=this.ctx.sampleRate*3, b=this.ctx.createBuffer(1,len,this.ctx.sampleRate), dta=b.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){ const wht=Math.random()*2-1; last=(last+0.02*wht)/1.02; dta[i]=last*3.2; }
    this.noiseBuf=b; this.ready=true;
    return true;
  },
  resume(){ if(this.ctx && this.ctx.state==="suspended") this.ctx.resume(); },
  setVol(k,v){ this.vol[k]=v; if(!this.ctx) return;
    this.master.gain.value = this.muted? 0 : this.vol.master;
    this.ambBus.gain.value = this.vol.amb; this.sfxBus.gain.value = this.vol.sfx; },
  mute(on){ this.muted=on; if(this.ctx) this.master.gain.value = on? 0 : this.vol.master; },

  /* --- briques --- */
  noise(){ const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true; return s; },
  gain(v){ const g=this.ctx.createGain(); g.gain.value=v; return g; },
  filt(type,f,q){ const b=this.ctx.createBiquadFilter(); b.type=type; b.frequency.value=f; if(q)b.Q.value=q; return b; },
  pan(v){ if(!this.ctx.createStereoPanner) return null; const p=this.ctx.createStereoPanner(); p.pan.value=v; return p; },
  env(node, a, d, peak){ const t=this.ctx.currentTime;
    node.gain.setValueAtTime(0.0001,t);
    node.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t+a);
    node.gain.exponentialRampToValueAtTime(0.0001, t+a+d); },
  vary(v, p){ return v*(1+(Math.random()*2-1)*(p||0.12)); },

  /* --- effets ponctuels --- */
  burst(f, q, dur, peak, type, dest){
    if(!this.init()) return; this.resume();
    const s=this.noise(), b=this.filt(type||"bandpass", this.vary(f), q||6), g=this.gain(0.0001);
    s.connect(b); b.connect(g); g.connect(dest||this.sfxBus);
    this.env(g, 0.006, this.vary(dur), peak==null?0.35:peak);
    s.start(); s.stop(this.ctx.currentTime+dur+0.1);
  },
  tone(f0, f1, dur, peak, type, dest){
    if(!this.init()) return; this.resume();
    const o=this.ctx.createOscillator(), g=this.gain(0.0001);
    o.type=type||"sine"; const t=this.ctx.currentTime;
    o.frequency.setValueAtTime(this.vary(f0,0.03), t);
    if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,this.vary(f1,0.03)), t+dur);
    o.connect(g); g.connect(dest||this.sfxBus);
    this.env(g, 0.008, dur, peak==null?0.18:peak);
    o.start(); o.stop(t+dur+0.12);
  },

  /* --- biblioth\u00e8que d'effets, chacun avec ses variantes --- */
  fx:{
    clic(S,d){ S.burst(1400+Math.random()*900, 9, .045, .22, "bandpass", d); },
    interrupteur(S,d){ S.burst(900, 5, .05, .3, "bandpass", d); setTimeout(()=>S.burst(2200,8,.04,.18,"bandpass",d), 45); },
    levier(S,d){ S.tone(180, 90, .28, .16, "sawtooth", d); S.burst(600, 3, .3, .12, "lowpass", d); },
    validation(S,d){ S.tone(660, 880, .12, .18, "sine", d); setTimeout(()=>S.tone(990,1180,.16,.15,"sine",d), 90); },
    erreur(S,d){ S.tone(190, 120, .3, .2, "square", d); },
    bip(S,d){ S.tone(1500, 1500, .05, .14, "square", d); },
    message(S,d){ S.tone(880, 1240, .07, .12, "sine", d); },
    mission(S,d){ S.tone(520,780,.1,.14,"triangle",d); setTimeout(()=>S.tone(1040,1560,.12,.11,"triangle",d),110); },
    notification(S,d){ S.tone(420, 620, .16, .16, "triangle", d); },
    /* portes et m\u00e9canismes */
    porte(S,d){ S.burst(320, 2.5, .5, .3, "lowpass", d);
      setTimeout(()=>S.burst(1800, 7, .12, .22, "bandpass", d), 90);
      setTimeout(()=>S.tone(70, 45, .5, .2, "sine", d), 140); },
    verrou(S,d){ S.burst(2400, 10, .05, .3, "bandpass", d); setTimeout(()=>S.burst(1200,8,.07,.25,"bandpass",d), 70); },
    coulisse(S,d){ S.burst(500, 1.6, .9, .18, "bandpass", d); setTimeout(()=>S.burst(900,4,.15,.2,"bandpass",d), 820); },
    /* machines */
    demarrage(S,d){ S.tone(40, 120, 1.1, .22, "sawtooth", d); S.burst(300, 1.5, 1.2, .12, "lowpass", d); },
    extinction(S,d){ S.tone(120, 30, 1.4, .2, "sawtooth", d); },
    relais(S,d){ S.burst(1100, 12, .04, .2, "bandpass", d); },
    /* objets */
    objet(S,d){ S.burst(700, 4, .09, .2, "bandpass", d); },
    pose(S,d){ S.burst(240, 2, .14, .26, "lowpass", d); },
    batterie(S,d){ S.tone(300, 460, .09, .16, "square", d); S.burst(1600, 9, .05, .14, "bandpass", d); },
    papier(S,d){ S.burst(3200, 1.4, .22, .12, "highpass", d); },
    cle(S,d){ S.burst(2800, 14, .06, .22, "bandpass", d); setTimeout(()=>S.burst(2200,12,.05,.16,"bandpass",d), 60); },
    /* nature et \u00e9v\u00e9nements */
    pierres(S,d){ for(let i=0;i<7;i++) setTimeout(()=>S.burst(260+Math.random()*500, 3, .12, .22, "bandpass", d), i*70+Math.random()*60); },
    grondement(S,d){ S.tone(58, 28, 2.2, .3, "sine", d); S.burst(90, 1.2, 2.4, .18, "lowpass", d); },
    fuite(S,d){ S.burst(4200, 1.2, 1.8, .16, "highpass", d); },
    rafale(S,d){ S.burst(500, .9, 2.6, .3, "lowpass", d); },
    /* pas, par surface */
    pas_metal(S,d){ S.burst(1500+Math.random()*600, 7, .06, .16, "bandpass", d); },
    pas_pierre(S,d){ S.burst(700+Math.random()*400, 3.5, .07, .15, "bandpass", d); },
    pas_terre(S,d){ S.burst(320+Math.random()*180, 1.6, .09, .17, "lowpass", d); },
    pas_eau(S,d){ S.burst(1800+Math.random()*900, 1.1, .16, .16, "highpass", d); }
  },
  play(kind, opts){
    if(this.muted || !this.init()) return; this.resume();
    const f=this.fx[kind]; if(!f) return;
    let dest=this.sfxBus;
    if(opts && (opts.pan!=null || opts.far!=null)){
      const g=this.gain(opts.far!=null? Math.max(0.06, 1-opts.far) : 1);
      const p=this.pan(opts.pan||0);
      if(p){ g.connect(p); p.connect(this.sfxBus); } else g.connect(this.sfxBus);
      dest=g;
    }
    f(this, dest);
  },
  /* son situ\u00e9 : plus la zone est loin, plus il est discret et lat\u00e9ralis\u00e9 */
  at(kind, zoneId, V){
    if(!V || !V.zones) return this.play(kind);
    const a=V.zones.find(z=>z.id===V.me.zone), b=V.zones.find(z=>z.id===zoneId);
    if(!a||!b) return this.play(kind);
    if(a.id===b.id) return this.play(kind);
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    this.play(kind, { far:Math.min(0.92, d/70), pan:Math.max(-1,Math.min(1,(b.x-a.x)/45)) });
  },

  /* --- couches d'ambiance --- */
  cont(kind, vol, dest){
    const S=this, C=this.ctx; let src, node;
    const mkNoise=(type,f,q,lfoRate,lfoAmt)=>{
      src=S.noise(); const b=S.filt(type,f,q), g=S.gain(0);
      src.connect(b); b.connect(g); g.connect(dest);
      if(lfoRate){ const lfo=C.createOscillator(), la=S.gain(lfoAmt);
        lfo.frequency.value=lfoRate; lfo.connect(la); la.connect(g.gain); lfo.start();
        node={g, extra:lfo}; } else node={g};
      src.start(); return g;
    };
    const mkTone=(fs,type,f,q,trem)=>{
      const g=S.gain(0), b=S.filt("lowpass",f,q); b.connect(g); g.connect(dest);
      const oscs=fs.map(fr=>{ const o=C.createOscillator(); o.type=type; o.frequency.value=fr; o.connect(b); o.start(); return o; });
      if(trem){ const lfo=C.createOscillator(), la=S.gain(vol*0.8); lfo.frequency.value=trem;
        lfo.connect(la); la.connect(g.gain); lfo.start(); oscs.push(lfo); }
      node={g, oscs}; return g;
    };
    let g;
    switch(kind){
      case "wind":    g=mkNoise("lowpass", 420, .8, .07, vol*0.7); break;
      case "leaves":  g=mkNoise("bandpass", 2600, 1.2, .19, vol*0.6); break;
      case "air":     g=mkNoise("lowpass", 700, .7); break;
      case "hiss":    g=mkNoise("highpass", 3400, .8, .13, vol*0.4); break;
      case "water":   g=mkNoise("bandpass", 520, 1.1, .11, vol*0.5); break;
      case "rumble":  g=mkNoise("lowpass", 70, .9, .05, vol*0.5); break;
      case "hum":     g=mkTone([50,100.5],"sine", 320, 1); break;
      case "buzz":    g=mkTone([119,238],"sawtooth", 620, .8); break;
      case "throb":   g=mkTone([41,62],"sine", 200, 1, 1.6); break;
      case "drone":   g=mkTone([55,82.4],"triangle", 400, .9); break;
      case "pulse":   g=mkTone([196],"sine", 500, 1, .5); break;
      default: return null;
    }
    g.gain.setTargetAtTime(vol, this.ctx.currentTime, 1.2);
    return { g, node, src, stop(){
      g.gain.setTargetAtTime(0.0001, S.ctx.currentTime, .7);
      setTimeout(()=>{ try{ if(src) src.stop(); if(node.oscs) node.oscs.forEach(o=>o.stop()); if(node.extra) node.extra.stop(); }catch(e){} }, 2200);
    }};
  },
  spor(kind, everyMs, spread){
    const S=this;
    const t=setInterval(()=>{
      if(S.muted) return;
      const g=S.gain(S.vol.amb*0.5), p=S.pan(Math.random()*1.6-0.8);
      if(p){ g.connect(p); p.connect(S.ambBus); } else g.connect(S.ambBus);
      const f=S.fx[kind]; if(f) f(S, g);
    }, everyMs+Math.random()*(spread||everyMs));
    return t;
  },
  /* oiseaux, insectes, gouttes : de courtes touches, jamais identiques */
  extraFx(){
    const S=this;
    this.fx.oiseau=(s,d)=>{ const f=1800+Math.random()*1400; s.tone(f, f*1.5, .09, .1, "sine", d);
      setTimeout(()=>s.tone(f*1.3, f*0.9, .07, .07, "sine", d), 110); };
    this.fx.insecte=(s,d)=>{ s.burst(5200, 12, .5, .05, "bandpass", d); };
    this.fx.goutte=(s,d)=>{ const f=900+Math.random()*900; s.tone(f, f*0.4, .1, .12, "sine", d); };
    this.fx.craquement=(s,d)=>{ s.burst(380+Math.random()*300, 5, .18, .12, "bandpass", d); };
    this.fx.metal=(s,d)=>{ s.burst(2600+Math.random()*1200, 16, .5, .07, "bandpass", d); };
    this.fx.geiger=(s,d)=>{ s.burst(3000, 14, .02, .12, "bandpass", d); };
    this.fx.instrument=(s,d)=>{ s.tone(1200, 1200, .04, .06, "square", d); };
  },

  /* --- ambiance d'une zone --- */
  recipes:{
    camp:{cont:{wind:.20}, spor:{oiseau:9000, craquement:14000}},
    foret:{cont:{wind:.26, leaves:.20}, spor:{oiseau:6000, insecte:11000}},
    observatoire:{cont:{wind:.42}, spor:{metal:9000, instrument:7000}},
    meteo:{cont:{wind:.34}, spor:{instrument:5000, metal:12000}},
    labo:{cont:{hum:.16, air:.10}, spor:{relais:7000, goutte:15000}},
    mine:{cont:{rumble:.20, air:.08}, spor:{goutte:4000, craquement:9000}, echo:.35},
    centre:{cont:{wind:.16}, spor:{craquement:6000, metal:13000}},
    contam:{cont:{hiss:.16, air:.08}, spor:{geiger:1400}},
    bunker:{cont:{hum:.12, air:.14}, spor:{metal:10000, goutte:12000}, echo:.25},
    grottes:{cont:{rumble:.14, air:.06}, spor:{goutte:2600}, echo:.5},
    centrale:{cont:{throb:.18, buzz:.10}, spor:{relais:5000}},
    village:{cont:{wind:.18, water:.16}, spor:{craquement:7000, goutte:9000}},
    complexe:{cont:{drone:.16, air:.12}, spor:{metal:11000, goutte:8000}, echo:.55},
    vallee:{cont:{wind:.30}, spor:{insecte:6000, oiseau:12000}},
    crete:{cont:{wind:.50}, spor:{metal:15000}},
    structure:{cont:{drone:.20, pulse:.10}, spor:{metal:9000}, echo:.6}
  },
  surface(id){
    if(["labo","bunker","centrale","complexe","structure","meteo","observatoire"].indexOf(id)>=0) return "pas_metal";
    if(["mine","grottes","crete"].indexOf(id)>=0) return "pas_pierre";
    if(id==="village") return "pas_eau";
    return "pas_terre";
  },
  setZone(id, world){
    if(!this.init() || this.zone===id) return;
    this.resume();
    if(!this.fx.oiseau) this.extraFx();
    this.stopAmb();
    this.zone=id;
    const r=this.recipes[id]; if(!r) return;
    let dest=this.ambBus;
    if(r.echo){ const dl=this.ctx.createDelay(1.2), fb=this.gain(r.echo*0.55), wet=this.gain(r.echo);
      dl.delayTime.value=0.28; dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(this.ambBus);
      const inG=this.gain(1); inG.connect(this.ambBus); inG.connect(dl); dest=inG; this.layers.push({stop(){ try{ fb.disconnect(); dl.disconnect(); }catch(e){} }}); }
    this.ambDest=dest;
    for(const k in r.cont){
      let v=r.cont[k];
      if((k==="hum"||k==="buzz"||k==="throb") && world && !world.power) v*=0.12;
      const L=this.cont(k, v, dest); if(L){ L.kind=k; this.layers.push(L); }
    }
    for(const k in r.spor) this.timers.push(this.spor(k, r.spor[k], r.spor[k]*0.8));
    if(world && world.storm) this.setStorm(true);
  },
  stopAmb(){ this.layers.forEach(l=>{ try{ l.stop(); }catch(e){} }); this.layers=[];
    this.timers.forEach(t=>clearInterval(t)); this.timers=[]; },
  setStorm(on){
    const w=this.layers.find(l=>l.kind==="wind");
    if(w) w.g.gain.setTargetAtTime(on? 0.75 : (this.recipes[this.zone]&&this.recipes[this.zone].cont.wind)||0.2, this.ctx.currentTime, on?2.5:3);
    if(on) this.play("rafale");
  },
  setPower(on){
    ["hum","buzz","throb"].forEach(k=>{ const l=this.layers.find(x=>x.kind===k);
      if(l){ const base=this.recipes[this.zone].cont[k]; l.g.gain.setTargetAtTime(on? base : base*0.12, this.ctx.currentTime, 1.6); } });
    this.play(on? "demarrage" : "extinction");
  }
};

 map(){
   const V=this.V, me=V.me, ns="http://www.w3.org/2000/svg", UIx=this;
   const PC=["var(--p0)","var(--p1)","var(--p2)","var(--p3)"];
   const svg=document.createElementNS(ns,"svg");
   svg.setAttribute("viewBox","0 0 100 104"); svg.setAttribute("class","topo");
   const mk=(tag,attrs,cls)=>{ const e=document.createElementNS(ns,tag);
     for(const k in attrs) e.setAttribute(k,attrs[k]); if(cls) e.setAttribute("class",cls); return e; };

   for(let i=0;i<7;i++){ const c=mk("ellipse",{cx:50+Math.sin(i)*12, cy:52+Math.cos(i)*10,
     rx:12+i*7, ry:9+i*6},"contour"); c.style.animationDelay=(i*1.3)+"s"; svg.appendChild(c); }
   const sc=mk("line",{x1:0,y1:0,x2:100,y2:0},"scan"); svg.appendChild(sc);

   const Z={}; V.zones.forEach(z=>Z[z.id]=z);
   /* --- connexions : bloqu\u00e9es, sous tempête, fraîchement ouvertes, empruntées --- */
   V.edges.forEach(e=>{ const a=Z[e[0]], b=Z[e[1]]; if(!a||!b) return;
     let cls="edge";
     if(V.locked && (V.locked[e[0]]||V.locked[e[1]])) cls+=" blocked";
     else if(V.world.storm) cls+=" storm";
     if(this.freshEdges && this.freshEdges[e[0]+e[1]]) cls+=" fresh";
     if(this.usedEdge===e[0]+e[1] || this.usedEdge===e[1]+e[0]) cls+=" used";
     svg.appendChild(mk("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y},cls)); });

   const from=Z[me.zone], cost=(V.world.storm?2:1);
   const openTargets=V.zones.filter(z=>V.moves[z.id] && V.moves[z.id].ok);
   const tip=$("#zoneTip");

   V.zones.forEach(z=>{
     const g=mk("g",{});
     const here=me.zone===z.id, mv=V.moves[z.id];
     let cls="node"; if(here) cls+=" here"; else if(mv&&mv.ok) cls+=" go seen"; else if(mv) cls+=" shut"; else cls+=" far";
     if(V.ping && V.ping.zone===z.id) cls+=" ping";
     if(this.moved && this.moved[z.id]) cls+=" moved";
     if(!V.world.power && (z.id==="labo"||z.id==="observatoire"||z.id==="centrale")) cls+=" dim";
     g.setAttribute("class",cls);
     g.appendChild(mk("circle",{cx:z.x, cy:z.y, r:here?3.6:2.8}));
     const t=mk("text",{x:z.x, y:z.y-4.6}); t.textContent=z.n.toUpperCase(); g.appendChild(t);
     if(z.hazard>0){ const h=mk("text",{x:z.x, y:z.y+1.1},"warn"); h.textContent="!"; g.appendChild(h); }

     /* marqueurs : un cercle color\u00e9 par joueur, jamais de dessin */
     const occ=V.players.filter(q=>q.zone===z.id);
     occ.forEach((q,i)=>{
       const gx=z.x + (i-(occ.length-1)/2)*3.2, gy=z.y+6.2;
       let mcls="mk"; if(q.busy) mcls+=" busy";
       if(V.ping && V.ping.name===q.name) mcls+=" call";
       const gm=mk("g",{},mcls);
       if(q.id===me.id) gm.appendChild(mk("circle",{cx:gx, cy:gy, r:2.2, stroke:PC[q.id%4]},"halo"));
       if(q.busy) gm.appendChild(mk("circle",{cx:gx, cy:gy, r:1.9, stroke:PC[q.id%4]},"ring"));
       const bd=mk("circle",{cx:gx, cy:gy, r:1.3, fill:q.dead? "#4A4A44" : PC[q.id%4]},"body");
       gm.appendChild(bd); g.appendChild(gm);
     });

     const info=()=>{
       const occ2=occ.map(q=>q.name).join(", ");
       return "<b>"+z.n+"</b>"+(z.hazard? "Zone dangereuse\u2009\u2014\u2009on y perd des points de vie.<br>":"")
         +(occ2? "Sur place : "+occ2+"<br>":"")
         +(here? "Vous \u00eates ici. Glissez d'ici vers une voisine."
           : mv? (mv.ok? "Accessible \u2014 "+cost+" action. Glissez jusqu'ici." : mv.why)
           : "Hors de port\u00e9e depuis votre position.");
     };
     g.addEventListener("pointerenter", ev=>{
       if(!tip || UIx.travelling) return;
       tip.innerHTML=info();
       const r=$("#mapBox").getBoundingClientRect();
       tip.style.left=Math.min(r.width-230, Math.max(4, z.x/100*r.width-110))+"px";
       tip.style.top=Math.max(4, z.y/104*r.height-70)+"px";
       tip.classList.add("on");
     });
     g.addEventListener("pointerleave", ()=>{ if(tip) tip.classList.remove("on"); });
     g.onclick=()=>{ if(Date.now()-(UIx.lastTravel||0)<400) return;
       UIx.note(z.n+" \u2014 "+(here? "vous \u00eates ici." : mv? (mv.ok? "accessible, glissez jusqu'ici." : mv.why) : "hors de port\u00e9e.")); };
     svg.appendChild(g); });

   if(from && !me.ready && me.ap>=cost && openTargets.length){
     svg.appendChild(mk("circle",{cx:from.x, cy:from.y, r:6.4},"grip"));
     const hp=mk("text",{x:from.x, y:from.y+10.8},"hint"); hp.textContent="glissez pour marcher"; svg.appendChild(hp);
   }

   const layer=mk("g",{}); svg.appendChild(layer);
   const clear=()=>{ while(layer.firstChild) layer.removeChild(layer.firstChild); };
   const toSvg=ev=>{ const r=svg.getBoundingClientRect();
     return { x:(ev.clientX-r.left)/r.width*100, y:(ev.clientY-r.top)/r.height*104 }; };
   const project=(p,a,b)=>{ const vx=b.x-a.x, vy=b.y-a.y, L2=vx*vx+vy*vy||1;
     let t=((p.x-a.x)*vx+(p.y-a.y)*vy)/L2; t=Math.max(0,Math.min(1,t));
     return { t, d:Math.hypot(p.x-(a.x+vx*t), p.y-(a.y+vy*t)) }; };
   const corridor = V.world.storm? 3.4 : 5;
   const rate = 1/(1000 + (V.world.storm?450:0) + (me.hp<=1?450:0) + (me.dead?600:0));
   let T=null, T2=null;

   const draw=()=>{
     clear(); if(!T||!T.to) return;
     const b=T.to;
     layer.appendChild(mk("line",{x1:from.x,y1:from.y,x2:b.x,y2:b.y},"tline"));
     const px=from.x+(b.x-from.x)*T.prog, py=from.y+(b.y-from.y)*T.prog;
     layer.appendChild(mk("line",{x1:from.x,y1:from.y,x2:px,y2:py},"tprog"+(T.off?" off":"")));
     layer.appendChild(mk("circle",{cx:px,cy:py,r:2},"tdot"+(T.off?" off":"")));
     const lb=mk("text",{x:(from.x+b.x)/2, y:(from.y+b.y)/2-3.4},"tlabel"+(T.off?" off":""));
     lb.textContent = T.off? "revenez sur la piste" : b.n.toUpperCase()+"  "+Math.round(T.prog*100)+"%";
     layer.appendChild(lb);
   };
   const step=()=>{
     if(!T){ T2=null; return; }
     const now=performance.now(), dt=Math.min(120, now-T.last); T.last=now;
     if(T.to && T.pt){
       const pr=project(T.pt, from, T.to);
       T.off = pr.d>corridor;
       if(!T.off) T.prog = Math.max(0, Math.min(pr.t, T.prog + dt*rate));
       if(!T.off && T.prog - (T.lastStep||0) > 0.14){ T.lastStep=T.prog;
         SND.play(SND.surface(T.to.id), {pan:(T.to.x-50)/60}); }
       draw();
       if(T.prog>=0.97){
         const id=T.to.id; T=null; UIx.travelling=false; UIx.lastTravel=Date.now(); clear();
         UIx.usedEdge=me.zone+id; setTimeout(()=>{ UIx.usedEdge=null; },4000);
         SND.play(SND.surface(id));
         Net.send({t:"move", zone:id});
         return;
       }
     }
     T2=requestAnimationFrame(step);
   };
   svg.addEventListener("pointerdown", ev=>{
     if(!from || me.ready) return;
     const p=toSvg(ev);
     if(Math.hypot(p.x-from.x,p.y-from.y)>7) return;
     if(!openTargets.length) return UIx.note("Aucune zone accessible depuis ici.");
     if(me.ap<cost) return UIx.note("Il vous faut "+cost+" action(s) pour marcher.");
     if(tip) tip.classList.remove("on");
     T={to:null, prog:0, last:performance.now(), off:false, pt:p};
     UIx.travelling=true;
     if(T2) cancelAnimationFrame(T2);
     T2=requestAnimationFrame(step);
     try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
     ev.preventDefault();
   });
   svg.addEventListener("pointermove", ev=>{
     if(!T) return;
     const p=toSvg(ev); T.pt=p;
     if(!T.to){
       if(Math.hypot(p.x-from.x,p.y-from.y)<3.2) return;
       let best=null, bd=1e9;
       V.zones.forEach(z=>{ if(!V.moves[z.id]) return; const d=project(p,from,z).d; if(d<bd){ bd=d; best=z; } });
       if(!best) return;
       const mv=V.moves[best.id];
       if(!mv.ok){ T=null; UIx.travelling=false; clear(); UIx.note(best.n+" \u2014 "+mv.why); return; }
       T.to=best; SND.play("interrupteur");
     }
     ev.preventDefault();
   });
   const stop=()=>{ if(T2){ cancelAnimationFrame(T2); T2=null; } if(!T) return;
     const p=T.prog; T=null; UIx.travelling=false; UIx.lastTravel=Date.now(); clear();
     if(p>0.08) UIx.note("Trajet interrompu : vous n'avez pas quitt\u00e9 la zone.");
     if(UIx.lastKey===null) UIx.render(); };
   svg.addEventListener("pointerup", stop);
   svg.addEventListener("pointercancel", stop);
   return svg;
 },

UI.openPuzzle = function(m){
  const hard = m.tier>=4;
  const s = this.openVeil(hard?"hard":null);
