  code:{fam:"MUL",w:d=>1,r:1},
  indices:{fam:"MUL",fam2:"DED",w:d=>4,r:1}
};
const famOf = k => (META[k]&&META[k].fam) || "LOG";

/* pondération des paliers : les pools existants restent, on y verse le neuf */
const POOL_ADD = [
  ["bascule","latin","flashgrid","inventaire","difference","scan","rotation","symetrie","sac","regle"],
  ["alibi","horaire","bascule","latin","flashgrid","inventaire","difference","scan","nback","rotation",
   "symetrie","nonogram","sac","trajet","interception","regle","syllog"],
  ["alibi","horaire","appariement","syllog","bascule","latin","nonogram","sac","trajet","nback",
   "scan","difference","rotation","symetrie","interception","regle","flashgrid"],
  ["appariement","horaire","alibi","syllog","nonogram","sac","trajet","nback","rotation","interception",
   "regle","flashgrid","difference"]
];
POOL_ADD.forEach((add,i)=>{ add.forEach(k=>{ if(POOLS[i].indexOf(k)<0) POOLS[i].push(k); }); });
/* La simulation montre que ces \u00e9preuves ne montent pas vraiment en difficult\u00e9 :
   on les garde pour les paliers bas et on les retire des paliers \u00e9lev\u00e9s.        */
const NO_SCALE=[["romains","unites","cesar","calibrage"],["romains","cesar","calibrage","molette"]];
NO_SCALE.forEach((list,i)=>{ POOLS[2+i]=POOLS[2+i].filter(k=>list.indexOf(k)<0); });

/* ---- choix d'une épreuve : on évite la répétition du type ET de la famille ---- */
function chooseKind(tier, hist){
  const pool=POOLS[Math.max(0,Math.min(3,tier-1))];
  const recentK=(hist&&hist.kinds)||[], recentF=(hist&&hist.fams)||[];
  const score=k=>{
    let s=rnd()*2.6;                     /* le hasard d'abord\u2026 */
    const ik=recentK.indexOf(k);         if(ik>=0) s-= (7-ik)*2.2;
    const f=famOf(k), iff=recentF.indexOf(f); if(iff>=0) s-= (5-iff)*1.9;
    if(META[k]&&META[k].fam2) s-=0.45;   /* les hybrides restent rares : ils frappent plus fort */
    return s; };
  let best=pool[0], bs=-1e9;
  pool.forEach(k=>{ const s=score(k); if(s>bs){ bs=s; best=k; } });
  return best;
}
function noteKind(hist,kind){
  hist.kinds.unshift(kind); if(hist.kinds.length>7) hist.kinds.pop();
  hist.fams.unshift(famOf(kind)); if(hist.fams.length>5) hist.fams.pop();
}

/* ============ 3quater. SIMULATION DE JOUEURS VIRTUELS ============ */
/* Chaque épreuve n'est qu'une donnée : on peut donc la faire « jouer » par des
   profils simulés, mesurer le taux de réussite et le temps, et en déduire la
   difficulté réelle plutôt que de la décréter à la main.                     */
const PROFILES = {
  NOVICE:{think:2.9, scan:.60, read:1.35, tap:.62, span:4.0, acc:.865, rt:470, rtSd:130, motor:.62, know:.45},
  CASUAL:{think:1.9, scan:.42, read:1.00, tap:.45, span:5.3, acc:.930, rt:375, rtSd:95,  motor:.79, know:.65},
  GOOD:  {think:1.25,scan:.29, read:.80,  tap:.34, span:6.6, acc:.966, rt:300, rtSd:70,  motor:.91, know:.83},
  EXPERT:{think:.85, scan:.20, read:.62,  tap:.26, span:7.8, acc:.986, rt:245, rtSd:52,  motor:.99, know:.94}
};
const PROF_ORDER=["NOVICE","CASUAL","GOOD","EXPERT"];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function gauss(){ let u=0,v=0; while(!u) u=rnd(); while(!v) v=rnd();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const phi = z => 0.5*(1+Math.tanh(0.7978845608*z*(1+0.044715*z*z)));

/* description du travail demandé par une épreuve, indépendamment du joueur */
function workOf(pz){
  const u=pz.ui, d=pz.tier, m=META[pz.kind]||{w:()=>3,r:1};
  const W={ read:(pz.instr||"").length/62, scan:0, think:m.w(d), risk:m.r||1,
            taps:1, mem:0, memSpeed:1, guess:0, chain:0, chainP:1, motor:null, know:0 };
  if(u.type==="choice"){ W.guess=u.options.length;
    W.scan=u.options.reduce((a,o)=>a+Math.min(6,String(o).length/14),0); }
  else if(u.type==="cells"){ W.scan=u.cells.length*(u.ref?1.6:1); W.guess=Math.min(12,u.cells.length); }
  else if(u.type==="order"){ W.taps=u.values.length; W.chain=u.values.length; W.think+=u.values.length*0.35; }
  else if(u.type==="pairs"){ W.mem=u.order.length; W.taps=u.order.length; W.chain=u.order.length; W.scan=u.order.length*2; }
  else if(u.type==="memory"){ W.mem=u.seq.length; W.memSpeed=clamp(.8+u.speed/2000,.85,1.15); W.taps=u.seq.length;
                              W.read+=u.seq.length*u.speed/1000; }
  else if(u.type==="recall"){ W.mem=u.list.length*0.8; W.read+=u.show/1000; W.guess=u.options.length; }
  else if(u.type==="flash"){ W.mem=(u.cells? Math.min(7,u.cells.length/2.2) : u.text.split("\n").length*1.15);
                             W.read+=u.show/1000; W.guess=u.options.length; W.scan=(u.cells?u.cells.length:8)*0.5; }
  else if(u.type==="series"){ W.chain=u.items.length; W.taps=u.items.length;
                              W.think=m.w(d)*u.items.length; W.mem=u.hide? 2.5+d*0.4 : 0; }
  else if(u.type==="switch"){ W.taps=u.start.length+3; W.think+=u.start.length*1.1; W.scan=u.start.length*2; }
  else if(u.type==="path"){ if(u.preview){ W.mem=u.preview.length*0.85; W.read+=u.preview.length*u.speed/1000;
                              W.taps=u.preview.length; W.chain=u.preview.length; }
                            else { const N=u.grid.length; W.scan=N*N; W.taps=N*1.6; } }
  else if(u.type==="fillgrid"){ const n=u.start.length;
    W.taps=u.mode==="sum"? n*0.6+1 : n*0.45+1; W.scan=n;
    if(u.mode==="exact"){ W.chain=n*0.4; W.think+=n*0.22; } }
  else if(u.type==="cables"){ W.taps=u.left.length; W.think+=u.left.length*1.1; W.scan=u.left.length*2; }
  else if(u.type==="bins"){ W.taps=u.items.length; W.think+=u.items.length*0.8; W.chain=u.items.length; }
  else if(u.type==="expr"){ W.taps=6; W.scan=u.nums.length; }
  else if(u.type==="code"){ W.taps=u.len; W.read+=u.len*2.5; }
  else if(u.type==="stroop"){ W.chain=u.list.length; W.taps=u.list.length; W.think=0.55*u.list.length; }
  else if(u.type==="reflex") W.motor={k:"win", rounds:u.rounds, win:u.win};
  else if(u.type==="lever")  W.motor={k:"hold", rounds:1, hold:u.hold, load:u.speed*22/u.width};
  else if(u.type==="chase")  W.motor={k:"hold", rounds:1, hold:u.hold, load:u.speed*0.42/u.rad};
  else if(u.type==="timing") W.motor={k:"stop", rounds:u.rounds, win:u.width/u.speed*1000};
  else if(u.type==="dial")   W.motor={k:"fine", rounds:1, tol:u.tol, rev:u.rev};
  else if(u.type==="sliders")W.motor={k:"fine", rounds:u.targets.length, tol:u.tol};
  if(pz.kind==="anglais") W.know=1;
  return W;
}

/* une tentative simulée : renvoie {ok, t, err} */
function simAttempt(pz, P){
  const W=workOf(pz), limit=pz.seconds;
  let t=W.read*P.read + W.scan*P.scan + W.taps*P.tap, err=0, ok=true;

  if(W.think>0){
    t += W.think*P.think*Math.exp(gauss()*0.34);
    if(W.know){ if(rnd()>P.know){ err++; ok = W.guess? rnd()<1/W.guess : false; } }
    else {
      const pStep=clamp(P.acc-(W.risk-1)*0.035, .55, .999);
      let p=Math.pow(pStep, W.think*W.risk);
      if(rnd()>p){ err++;
        /* on se reprend : deuxième passe plus lente, sinon on tente au hasard */
        t += W.think*P.think*0.55;
        if(rnd()>Math.pow(pStep, W.think*W.risk*0.8)){ err++; ok = W.guess? rnd()<1/W.guess : false; } } }
  }
  if(ok && W.mem>0){
    const p=clamp(phi((P.span*W.memSpeed - W.mem)*1.15), .02, .995);
    if(rnd()>p){ err++; ok = W.guess? rnd()<1/W.guess : false; }
  }
  if(ok && W.chain>0){
    const pItem=clamp(P.acc+0.012, .5, .998);
    if(rnd()>Math.pow(pItem, W.chain)){ err++; ok=false; }
  }
  if(ok && W.motor){
    const M=W.motor;
    if(M.k==="win"){
      const p=clamp(phi((M.win-P.rt)/P.rtSd)-0.03, .01, .995);
      if(rnd()>Math.pow(p,M.rounds)) { err++; ok=false; }
      t += M.rounds*(1.55+P.rt/1000);
    } else if(M.k==="hold"){
      const p=clamp(1-M.load/(12*P.motor), .02, .985);
      if(rnd()>p){ err++; ok=false; }
      t += M.hold*1.9+2.2;
    } else if(M.k==="stop"){
      const p=clamp(phi(M.win*0.5*P.motor/72), .03, .995);
      if(rnd()>Math.pow(p,M.rounds)){ err++; ok=false; }
      t += M.rounds*1.5;
    } else if(M.k==="fine"){
      const p=clamp(1-(4.4-M.tol*0.45)/(13*P.motor), .05, .99);
      if(rnd()>Math.pow(p,M.rounds)){ err++; if(rnd()>P.motor) ok=false; }
      t += M.rounds*(4.6-M.tol*0.35)*(1.9-P.motor) + (M.rev?3:0);
    }
  }
  if(t>limit) ok=false;
  return {ok, t, err};
}

function stats(a){ if(!a.length) return {n:0, mean:0, med:0, min:0, max:0, p80:0};
  const s=a.slice().sort((x,y)=>x-y), q=f=>s[Math.min(s.length-1,Math.floor(s.length*f))];
  return {n:a.length, mean:a.reduce((x,y)=>x+y,0)/a.length, med:q(.5), min:s[0], max:s[s.length-1], p80:q(.8)}; }

const TIER_BAND=[[18,40],[22,52],[26,68],[30,95]];
/* évalue une épreuve : N tentatives par profil */
function evaluate(kind, tier, N){
  N=N||300;
  const res={}; PROF_ORDER.forEach(k=>res[k]={ok:0, t:[], tAll:[], err:0});
  for(let i=0;i<N;i++){
    let pz; try{ pz=makePuzzle(tier, kind); }catch(e){ continue; }
    PROF_ORDER.forEach(k=>{ const r=simAttempt(pz, PROFILES[k]);
      const R=res[k]; R.err+=r.err; R.tAll.push(Math.min(r.t,pz.seconds));
      if(r.ok){ R.ok++; R.t.push(r.t); } });
  }
  const out={kind, tier, fam:famOf(kind), fam2:(META[kind]||{}).fam2||null, N, prof:{}};
  let limit=0; { const pz=makePuzzle(tier,kind); limit=pz.seconds; out.limit=limit; }
  PROF_ORDER.forEach(k=>{ const R=res[k], st=stats(R.t);
    out.prof[k]={ succ:R.ok/N, err:R.err/N, mean:st.mean, med:st.med, min:st.min, max:st.max, p80:st.p80 }; });
  const W={NOVICE:.2, CASUAL:.3, GOOD:.3, EXPERT:.2};
  let succW=0; PROF_ORDER.forEach(k=>succW+=W[k]*out.prof[k].succ);
  const press=clamp((out.prof.CASUAL.med||limit)/limit, 0, 1.2);
  out.score=clamp(8.2*(1-succW)+2.2*press, 0, 10);
  out.level=["TRÈS FACILE","FACILE","MOYEN","DIFFICILE","TRÈS DIFFICILE","EXTRÊME"]
            [Math.min(5,Math.floor(out.score/2)+(out.score>=9?1:0))] || "MOYEN";
  const p=out.prof;
  out.flag = (p.EXPERT.succ<0.5 || p.GOOD.succ<0.22) ? "TOO_HARD"
           : (p.NOVICE.succ>0.9 && (p.CASUAL.med||limit)<0.5*limit && p.CASUAL.err<0.15) ? "NEEDS_REWORK"
           : (p.EXPERT.succ>=0.78 && p.GOOD.succ>=0.5 && p.GOOD.succ<=0.93 &&
              p.CASUAL.succ>=0.25 && p.CASUAL.succ<=0.82 && p.NOVICE.succ<=0.72) ? "IDEAL" : "OK";
  const band=TIER_BAND[tier-1];
  /* le temps laisse une marge au bon joueur\u2026 qui fond aux paliers hauts.
     Si personne ne finit, on \u00e9largit au lieu de r\u00e9tr\u00e9cir : sinon l'\u00e9preuve s'\u00e9trangle toute seule. */
  let marge=[1.3,1.15,1.05,0.95][tier-1];
  if(p.EXPERT.succ<0.6) marge*=1.25;      /* trop dure : on rend du temps avant de rendre l'\u00e9nonc\u00e9 plus pauvre */
  const base = p.GOOD.succ>=0.25 ? p.GOOD.p80
             : p.EXPERT.succ>=0.25 ? p.EXPERT.p80*1.15
             : limit*1.45;
  out.recSec=Math.round(clamp(base*marge, band[0], band[1]));
  return out;
}
function evaluateAll(N, kinds){
  const list=kinds||[...new Set([].concat(...POOLS))].filter(k=>PZ[k]);
  const rows=[];
  list.forEach(k=>{ for(let t=1;t<=4;t++){
    if(POOLS[t-1].indexOf(k)<0) continue;
    rows.push(evaluate(k,t,N)); } });
  rows.sort((a,b)=>b.score-a.score);
  return rows;
}

function newGame(names, modeId){
  const nP=names.length, tu=TUNE[Math.max(2,Math.min(8,nP))];
  const M=MODES[modeId]||MODES.decouverte, k=M.court?0:1;
  const MP = (!M.court || nP>=5)? MAPS.grande : MAPS.petite;
  ZONES = MP.zones.map(z=>({...z, loot:[], sealed:false}));
  const easy = modeId==="decouverte";
  G = { nP, easy, mode:modeId, longMode:!M.court, mapH:MP.h, round:1,
        time:tu.time[k]*60, timeTotal:tu.time[k]*60, apBase:tu.ap[k],
        missionCount:M.missions, pzBonus:M.pzBonus, tierBoost:M.tierBoost, hazardRisk:M.hazard,
        players:[], edges:[], newEdges:[], doneActs:[], public:[], mut:0, endFlag:null, over:false,
        world:{energy:0,power:false,labo_on:false,comms:false,coffre:false,scelle:false,sas:false,reveil:false,
               neutralise:false,extraction:false,observatoire_open:false,mine_open:false,bunker_open:false,
               labo_unlocked:false,storm:0,anomaly:0,shield:false} };
  ZONES.forEach(z=> z.adj.forEach(a=>{ if(!G.edges.some(e=>(e[0]===z.id&&e[1]===a)||(e[0]===a&&e[1]===z.id))) G.edges.push([z.id,a]); }));
  const per=tu.loot*M.loot;
  const pool=["batterie","composant","materiau","outil","carburant","ration","medicament","cle","combinaison","fragment"];
  ZONES.filter(z=>z.id!=="camp").forEach(z=>{ const n=Math.max(1,Math.round((rnd()*2+1)*per/3)); for(let i=0;i<n;i++) z.loot.push(pick(pool)); });
  zoneOf("camp").loot.push("ration","outil","materiau");
  zoneOf("labo").loot.push("donnees"); zoneOf("bunker").loot.push("cle"); zoneOf("centre").loot.push("fragment","cle");
  const ids=ZONES.map(z=>z.id);
  const usable=MISSIONS.filter(m=>!m.z || m.z.every(x=>ids.indexOf(x)>=0)).map(m=>m.id);
  let bag=shuffle(usable);
  names.forEach((nm,i)=>{
    const mine=[];
    const conflicts=id=>mine.some(x=>CONFLICTS.some(c=>(c[0]===x&&c[1]===id)||(c[1]===x&&c[0]===id)));
    for(const id of bag.slice()){
      if(mine.length===G.missionCount) break;
      if(conflicts(id)) continue;
      mine.push(id); bag=bag.filter(z=>z!==id);
    }
    if(mine.length<G.missionCount){                       /* vivier \u00e9puis\u00e9 : on recycle */
      for(const id of shuffle(usable)){
        if(mine.length===G.missionCount) break;
        if(mine.indexOf(id)>=0 || conflicts(id)) continue;
        mine.push(id);
      }
    }
    const objs=mine.map(id=>MISSIONS.find(m=>m.id===id)).sort((a,b)=>b.w-a.w);
    const pts=[100,70,55,40,30,20];
    G.players.push({ id:i, name:nm, zone:"camp", hp:3, ap:0, inv:{ration:1}, dead:false, ready:false, notes:[],
      visited:["camp"], acts:[], actZones:[], coop:0, coop3:0, gifts:0, recu:0, fails:0, solved:0, kinds:[],
      searches:0, walks:0, heals:0, healed:0, earlyActs:0, journal:[], flags:{}, gaveThisTurn:0,
      missions:objs.map((m,k)=>({ref:m, pts:pts[k], mutated:false})) });
  });
  const st=["outil","batterie","materiau","composant"];
  G.players.forEach((p,i)=>{ give(p,st[i%st.length]); if(easy||G.longMode) give(p,"ration"); });
  startRound(true);
}

    else if(z.hazard===1 && rnd()<G.hazardRisk){ damage(p,1); note(p,"Terrain instable : \u20131 point de vie."); }

  ev.eff(G);
  const evSnd={tempete:"rafale", gel:"rafale", panne:"extinction", effondrement:"pierres",
               cache:"coulisse", anomalie:"notification", contamination:"fuite", reveil:"grondement", calme:"notification"};
  Net.broadcast({t:"sfx", k:evSnd[ev.id]||"notification", zone:null});
  pub("\u26A1 "+ev.n+" \u2014 "+ev.txt);
  Net.broadcast({t:"chat", from:"\u26A1 "+ev.n, id:-1, text:ev.txt});
  G.lastEvent=ev;
  startRound(false);
}
function checkMutations(p){
  if(G.mut>=3 || rnd()>0.3) return;
  for(const m of p.missions){
    if(m.mutated) continue;
    const rule=MUTATIONS.find(r=>r.from===m.ref.id && r.when(G));
    if(rule){ m.ref=rule.to; m.mutated=true; m.fresh=true; G.mut++;
      Net.toPlayer(p.id,{t:"mutation", title:rule.to.t.replace("NOUVEL OBJECTIF \u2014 ",""), desc:rule.to.d, pts:m.pts});
      return; }
  }
}
/* ---- d\u00e9placement / fouille / grandes actions ---- */
function canEnter(p,id){
  const z=zoneOf(id);
  if(!z||z.hidden) return {ok:false, why:"Zone inconnue."};
  if(z.sealed) return {ok:false, why:"Acc\u00e8s ferm\u00e9 d\u00e9finitivement."};
  if(!adjacents(p.zone).includes(id)) return {ok:false, why:"Trop loin."};
  if(id==="observatoire"&&!G.world.observatoire_open) return {ok:false, why:"\u00c9boulis : d\u00e9gagez la route depuis la For\u00eat Nord."};
  if(id==="labo"&&!G.world.labo_unlocked&&!(p.inv.cle>0)) return {ok:false, why:"Porte ferm\u00e9e : il faut un Badge."};
  if(id==="bunker"&&!G.world.bunker_open) return {ok:false, why:"Porte blind\u00e9e : forcez-la depuis le Centre abandonn\u00e9."};
  if(id==="structure"&&playersIn("complexe").length<Math.min(3,G.nP)) return {ok:false, why:"Le sas exige 3 explorateurs pr\u00e9sents dans le Complexe."};
  return {ok:true};
}
const moveCost = ()=> 1 + (G.world.storm?1:0);
function doMove(p,id){
  const r=canEnter(p,id);
  if(!r.ok) return note(p,r.why);
  if(p.ap<moveCost()) return note(p,"Il faut "+moveCost()+" action(s).");
  p.ap-=moveCost(); p.zone=id; p.walks++;
  if(!p.visited.includes(id)) p.visited.push(id);
  if(id==="labo") G.world.labo_unlocked=true;
}
function helpersFor(p){ return playersIn(p.zone).filter(q=>!q.dead && !q.ready && (q.id===p.id? q.ap>=2 : q.ap>=1)); }
function whyNot(p,a){
  if(p.dead) return "Vous \u00eates \u00e0 terre.";
  if(p.ap<2) return "Il faut 2 actions (il vous en reste "+p.ap+").";
  if(a.req&&!a.req(G)) return a.id==="descendre" ? "Le complexe est scell\u00e9." : "Il faut d'abord remettre le courant.";
  for(const k in (a.cost||{})) if((p.inv[k]||0)<a.cost[k]) return "Il vous manque : "+a.cost[k]+" \u00d7 "+iname(k);
  const n=helpersFor(p).length, need=needOf(a);
  if(n<need) return "Il faut "+need+" explorateurs pr\u00eats ici (vous \u00eates "+n+").";
  return null;
}
function tierOf(a){ let t=a.pz+1+(G.tierBoost||0);
  if(rnd()<0.45) t++; if(rnd()<0.15) t++; return Math.max(1,Math.min(4,t)); }
/* difficult\u00e9 dynamique : on suit la forme du joueur sans jamais l'annoncer */
function adaptTier(p, tier){
  const f=p.flow||0; let t=tier;
  if(f>=2.5 && rnd()<0.65) t++;
  if(f<=-2.5 && rnd()<0.7) t--;
  return Math.max(1, Math.min(4, t));
}
function noteFlow(p, ok, ratio){
  const d = ok? (ratio<0.55? 1 : ratio<0.85? 0.4 : 0) : -1.4;
  p.flow = Math.max(-3.5, Math.min(3.5, (p.flow||0)*0.82 + d));
}
function askPuzzle(p, tier, kind, cb, extra){
  if(!p.hist) p.hist={kinds:[], fams:[]};
  const pz=makePuzzle(adaptTier(p,tier), kind, p.hist);
  noteKind(p.hist, pz.kind); p.lastKind=pz.kind;
  const pid=++PZSEQ;
  PEND[p.id]={pid,pz,cb,deadline:Date.now()+(pz.seconds+4)*1000, t0:Date.now()};
  Net.toPlayer(p.id,{t:"puzzle", pid, title:pz.title, instr:pz.instr, ui:pz.ui, fam:pz.fam, press:pz.press,
                     seconds:pz.seconds, tier:pz.tier, tag:extra||""});
}
function askCode(p, parts, cb){
  /* au moins 3 chiffres, même à deux : les chiffres sont répartis en alternance,
     personne ne voit le code entier. */
  const len=Math.max(3, parts.length);
  const code=Array.from({length:len},()=>ri(1,9));
  const digitsOf=q=>{ const out=[]; for(let i=0;i<len;i++) if(parts[i%parts.length].id===q.id) out.push({pos:i+1, value:code[i]}); return out; };
  parts.forEach(q=>{ if(q.id!==p.id) Net.toPlayer(q.id,{t:"digit", digits:digitsOf(q), total:len, from:p.name}); });
  const pid=++PZSEQ, secs=9*len+10;
  const pz={ui:{type:"code",len}, answer:code, seconds:secs, tier:1};
  PEND[p.id]={pid,pz,cb,deadline:Date.now()+(secs+4)*1000};
  const mine=digitsOf(p).map(dg=>"n\u00b0"+dg.pos+" = "+dg.value).join(", ");
  Net.toPlayer(p.id,{t:"puzzle", pid, title:"Code \u00e0 "+len+" chiffres", ui:pz.ui, seconds:secs, tier:1,
    instr:"Vous connaissez "+mine+".\nLes autres chiffres sont sur les \u00e9crans de vos \u00e9quipiers : demandez-les et tapez le code dans l'ordre."});
}
/* épreuve coopérative n°2 : chacun détient une partie des indices */
function askIndices(p, parts, cb){
  const {gens, coupable, parts:lots} = buildIndices(parts.length);
  parts.forEach((q,i)=>{ if(q.id!==p.id)
    Net.toPlayer(q.id,{t:"clue", lines:lots[i], from:p.name}); });
  const pid=++PZSEQ, secs=18+8*parts.length;
  const pz={ kind:"indices", tier:2, ui:{type:"choice", options:gens}, answer:gens.indexOf(coupable),
             seconds:secs };
  PEND[p.id]={pid,pz,cb,deadline:Date.now()+(secs+4)*1000,t0:Date.now()};
  Net.toPlayer(p.id,{t:"puzzle", pid, title:"Recouper les t\u00e9moignages", fam:FAMS.MUL, seconds:secs, tier:2,
    ui:pz.ui, instr:"Vos \u00e9quipiers ont chacun re\u00e7u des indices que vous ne voyez pas :\n\u2022 "
      + lots[0].join("\n\u2022 ") + "\n\nDemandez-leur les autres \u00e0 voix haute, puis d\u00e9signez la personne recherch\u00e9e."});
}
function submit(p,pid,value){
  const e=PEND[p.id]; if(!e||e.pid!==pid) return;
  delete PEND[p.id];
  const ok=checkAnswer(e.pz,value);
  noteFlow(p, ok, e.t0? Math.min(1.2,(Date.now()-e.t0)/1000/Math.max(1,e.pz.seconds)) : 1);
  if(ok){ p.solved++; if(e.pz.kind && p.kinds.indexOf(e.pz.kind)<0) p.kinds.push(e.pz.kind); }
  Net.toPlayer(p.id,{t:"result", ok, code:e.pz.ui.type==="code"});
  e.cb(ok);
}
function timeoutPuzzles(){
  const now=Date.now();
  Object.keys(PEND).forEach(k=>{ const e=PEND[k]; if(now>e.deadline){ delete PEND[k];
    { const pl=G.players.find(x=>x.id===+k); if(pl) noteFlow(pl,false,1); }
    Net.toPlayer(+k,{t:"result", ok:false, late:true}); e.cb(false); } });
}
function doSearch(p){
  if(p.dead) return note(p,"Un explorateur \u00e0 terre ne peut pas fouiller.");
  if(p.ap<1) return note(p,"Plus assez d'actions.");
  if(PEND[p.id]) return;
  p.ap--;
  const z=zoneOf(p.zone);
  askPuzzle(p, (rnd()<0.45?3:2)+(G.tierBoost||0), null, ok=>{
    if(ok){
      p.searches++;
      if(z.loot.length){ const it=z.loot.pop(); give(p,it); note(p,"Trouv\u00e9 : "+iname(it)); }
      else if(rnd()<0.45){ const it=pick(["materiau","ration","batterie"]); give(p,it); note(p,"Trouv\u00e9 : "+iname(it)); }
      else note(p,"Rien d'utile ici.");
      if(rnd()<0.45){ const c=pick(CLUES); p.journal.push(c); note(p,"Vous seul voyez \u00e7a : "+c); }
    } else { p.fails++; note(p,"Fouille rat\u00e9e."); }
    Net.pushAll();
  }, "Fouille de "+z.n);
}
function doAct(p,id){
  const a=ACTIONS.find(x=>x.id===id);
  if(!a || a.zone!==p.zone || G.doneActs.includes(id) || PEND[p.id]) return;
  const why=whyNot(p,a); if(why) return note(p,why);
  const parts=[p,...helpersFor(p).filter(q=>q.id!==p.id)].slice(0,needOf(a));
  for(const k in (a.cost||{})) take(p,k,a.cost[k]);
  p.ap-=2; parts.forEach(q=>{ if(q.id!==p.id) q.ap-=1; });
  const tier=tierOf(a);
  const finish=ok=>{
    if(ok){
      G.doneActs.push(a.id);
      parts.forEach(q=>{ q.acts.push(a.id); if(q.actZones.indexOf(a.zone)<0) q.actZones.push(a.zone);
        if(parts.length>1) q.coop++; if(parts.length>2) q.coop3++;
        if(G.time>G.timeTotal/2){ q.flags.earlyAct=true; q.earlyActs++; } });
      a.eff(G,p);
      const snd = ["reactiver_centrale","alimenter_labo","comms","relais"].indexOf(a.id)>=0 ? "demarrage"
                : ["porte_bunker","coffre","descendre","sceller"].indexOf(a.id)>=0 ? "porte"
                : ["rouvrir_mine","deblayer_route","degager_eboulis"].indexOf(a.id)>=0 ? "pierres"
                : ["prelever"].indexOf(a.id)>=0 ? "fuite" : "validation";
      Net.broadcast({t:"sfx", k:snd, zone:p.zone});
      pub(a.n+" \u2014 par "+parts.map(q=>q.name).join(", "));
      checkMutations(p);
    } else {
      parts.forEach(q=>{ q.fails++; note(q,"\u00c9chec sur \u00ab "+a.n+" \u00bb."); });
      G.time-=15; pub("\u00c9chec : "+a.n+" (\u201315 s pour tout le monde)");
      Net.broadcast({t:"sfx", k:"erreur", zone:p.zone});
    }
    checkEnd(); Net.pushAll();
  };
  const run=()=> askPuzzle(p, tier, null, finish, a.n);
  if(parts.length>1){ const coop = rnd()<0.5? askCode : askIndices;
    coop(p, parts, ok=> ok? run() : finish(false)); }
  else run();
  Net.pushAll();
}
function doGive(p,toId,item){
  Net.broadcast({t:"sfx", k:(item==="batterie"?"batterie":item==="cle"?"cle":item==="donnees"||item==="fragment"?"papier":"pose"), zone:p.zone});
  const q=G.players.find(x=>x.id===toId);
  if(!q||q.zone!==p.zone) return;
  if(p.gaveThisTurn>=2) return note(p,"Deux dons maximum par tour.");
  if(!take(p,item)) return;
  give(q,item); p.gifts++; q.recu++; p.gaveThisTurn++;
  note(q,p.name+" vous donne : "+iname(item));
  pub(p.name+" donne "+iname(item)+" \u00e0 "+q.name);
}
function doMed(p,toId){
  const q=G.players.find(x=>x.id===toId);
  if(!q||q.zone!==p.zone||!take(p,"medicament")) return;
  p.flags.usedMed=true;
  p.heals++; q.healed++;
  if(q.dead){ q.dead=false; q.hp=1; pub(q.name+" est remis sur pied par "+p.name+"."); }
  else { q.hp=Math.min(3,q.hp+1); pub(q.name+" est soign\u00e9 par "+p.name+"."); }
}
function checkEnd(){ if(!G.over && (G.time<=0 || G.endFlag)){ endGame(); return true; } return false; }
function endGame(){
  G.over=true; G.time=Math.max(0,G.time);
  G.players.forEach(p=>{
    let s=0; p.detail=[];
    p.missions.forEach(m=>{ const ok=!!m.ref.c(p,G); if(ok) s+=m.pts;
      p.detail.push({t:m.ref.t, d:m.ref.d, ok, pts:ok?m.pts:0, mut:m.mutated}); });
    const bon=[];
    if(!p.dead){ s+=10; bon.push(["Survivant","+10"]); } else { s-=5; bon.push(["\u00c0 terre \u00e0 la fin","\u20135"]); }
    if(G.world.extraction&&p.zone==="camp"){ s+=15; bon.push(["Pr\u00e9sent au d\u00e9part","+15"]); }
    if(G.world.verite && p.acts.indexOf("comprendre")>=0){ s+=40; bon.push(["A compris ce qui s'est pass\u00e9","+40"]); }
    if(p.fails){ s-=2*p.fails; bon.push([p.fails+" \u00e9preuve(s) rat\u00e9e(s)","\u2013"+2*p.fails]); }
    p.bonus=bon; p.score=s;
  });
  Net.broadcast({t:"end", results:G.players.map(p=>({name:p.name, score:p.score, detail:p.detail, bonus:p.bonus,
    journal:p.journal})).sort((a,b)=>b.score-a.score), reason:G.endFlag||"Le chrono est \u00e9puis\u00e9."});
}
const CLUES = [
 "Une photo : quatorze personnes devant la centrale, un visage gratt\u00e9.",
 "Sur un mur : \u00ab NE PAS DESCENDRE APR\u00c8S LE NIVEAU 3 \u00bb.",
 "Un carnet : la temp\u00e9rature monte sous la mine, jamais en surface.",
 "Une radio bloqu\u00e9e sur une fr\u00e9quence vide qui gr\u00e9sille toutes les 11 secondes.",
 "Des bottes align\u00e9es devant un sas ferm\u00e9 de l'int\u00e9rieur.",
 "Un plan annot\u00e9 : une salle dessin\u00e9e l\u00e0 o\u00f9 il n'y a que de la roche.",
 "Un registre : toutes les derni\u00e8res sorties sont \u00ab retour non enregistr\u00e9 \u00bb."
];
/* ---- vue envoy\u00e9e \u00e0 chaque joueur ---- */
function viewFor(p){
  const moves={};
  adjacents(p.zone).forEach(id=>{ const z=zoneOf(id); if(!z||z.hidden) return; moves[id]=canEnter(p,id); });
  return {
    round:G.round, time:G.time, apBase:G.apBase, nP:G.nP, easy:G.easy, mapH:G.mapH, mode:G.mode,
    world:G.world, feed:G.public.slice(0,8),
    zones:ZONES.filter(z=>!z.hidden).map(z=>({id:z.id,n:z.n,x:z.x,y:z.y,hazard:z.hazard,sealed:z.sealed})),
    edges:G.edges,
    players:G.players.map(q=>({id:q.id,name:q.name,zone:q.zone,hp:q.hp,dead:q.dead,ap:q.ap,ready:q.ready,busy:!!PEND[q.id]})),
    locked:ZONES.filter(z=>!z.hidden).reduce((a,z)=>{ a[z.id]=(z.sealed
      || (z.id==='observatoire'&&!G.world.observatoire_open)
      || (z.id==='labo'&&!G.world.labo_unlocked)
      || (z.id==='bunker'&&!G.world.bunker_open)); return a; },{}),
    ping:(G.ping && Date.now()-G.ping.at<30000)? {zone:G.ping.zone, name:G.ping.name} : null,
    moves,
    actions:ACTIONS.filter(a=>a.zone===p.zone&&!G.doneActs.includes(a.id)).map(a=>({
      id:a.id, n:a.n, desc:a.desc, need:needOf(a), tier:a.pz,
      cost:Object.keys(a.cost||{}).map(k=>a.cost[k]+" \u00d7 "+iname(k)).join(", "),
      why:whyNot(p,a) })),
    me:{ id:p.id, name:p.name, zone:p.zone, ap:p.ap, hp:p.hp, dead:p.dead, ready:p.ready, gave:p.gaveThisTurn,
         inv:Object.keys(p.inv).map(k=>({k, n:p.inv[k], g:ITEMS[k].g, name:iname(k)})),
         journal:p.journal.slice().reverse(),
         missions:p.missions.map(m=>({t:m.ref.t, d:m.ref.d, pts:m.pts, done:!!m.ref.c(p,G), mut:m.mutated})) },
    notes:(()=>{ const n=p.notes.slice(); p.notes.length=0; return n; })()
  };
}

/* ============ 5. R\u00c9SEAU (WebRTC via PeerJS) ============ */
const ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const mkCode = ()=> Array.from({length:4},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join("");
const PEER_CFG = { debug:0, config:{ iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"stun:stun1.l.google.com:19302"},
  {urls:"turn:openrelay.metered.ca:80",  username:"openrelayproject", credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443", username:"openrelayproject", credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443?transport=tcp", username:"openrelayproject", credential:"openrelayproject"}
]}};
const Net = {
  role:null, peer:null, code:null, conns:{}, slots:[], started:false, mode:"decouverte", error:null,
  toPlayer(id,msg){ if(id===0 && this.role==="host") return clientReceive(msg);
                    const c=this.conns[id]; if(c&&c.open){ try{ c.send(msg); }catch(e){} } },
  broadcast(msg){ (G? G.players : this.slots).forEach(p=>this.toPlayer(p.id,msg)); },
  pushAll(){ if(!G) return; G.players.forEach(p=>this.toPlayer(p.id,{t:"view", v:viewFor(p)})); },
  lobbyPush(){ const list=this.slots.map(s=>s.name);
    this.slots.forEach(s=>this.toPlayer(s.id,{t:"lobby", code:this.code, players:list, mode:this.mode, host:s.id===0})); },
  send(msg){ if(this.role==="host") return handleClient(0,msg);
             if(this.conn&&this.conn.open) this.conn.send(msg); },

  createRoom(name, done0){
    let called=false; const done=e=>{ if(called) return; called=true; done0(e); };
    if(typeof Peer==="undefined") return done("La biblioth\u00e8que r\u00e9seau n'est pas charg\u00e9e (r\u00e9seau bloqu\u00e9 ?). Rechargez la page.");
    this.role="host"; this.code=mkCode();
    this.slots=[{id:0,name:name||"H\u00d4TE"}];
    this.peer=new Peer("utr-"+this.code, PEER_CFG);
    this.peer.on("open", ()=>done(null));
    this.peer.on("error", e=>done("Connexion impossible ("+e.type+"). R\u00e9essayez."));
    this.peer.on("connection", c=>{
      c.on("data", m=>{
        if(m.t==="hello"){
          if(this.started || this.slots.length>=8){ c.send({t:"full"}); return; }
          const id=this.slots.length;
          this.slots.push({id, name:(m.name||"EXPLO").toUpperCase().slice(0,10)});
          this.conns[id]=c; c._pid=id;
          this.lobbyPush(); UI.render();
        } else if(c._pid!=null) handleClient(c._pid, m);
      });
      c.on("close", ()=>{ if(c._pid!=null && G) pub((this.slots[c._pid]||{}).name+" a perdu la connexion."); UI.render(); });
    });
  },
  joinRoom(code, name, done0){
    let called=false; const done=e=>{ if(called) return; called=true; done0(e); };
    if(typeof Peer==="undefined") return done("Impossible de charger la biblioth\u00e8que r\u00e9seau.");
    this.role="client"; this.code=code.toUpperCase().trim();
    this.peer=new Peer(PEER_CFG);
    this.peer.on("error", e=> done(e.type==="peer-unavailable" ? "Aucune partie avec ce code." : "Connexion impossible ("+e.type+")."));
    const giveUp=setTimeout(()=>done("La liaison n'a pas pu s'\u00e9tablir en 20 s. V\u00e9rifiez que l'h\u00f4te a bien gard\u00e9 son onglet ouvert ; si le probl\u00e8me persiste, essayez en partage de connexion mobile (certains r\u00e9seaux d'\u00e9cole bloquent ce type de liaison)."), 20000);
    this.peer.on("open", ()=>{
      UI.banner="Salle trouv\u00e9e, \u00e9tablissement de la liaison\u2026"; UI.render();
      this.conn=this.peer.connect("utr-"+this.code, {reliable:true});
      this.conn.on("open", ()=>{ clearTimeout(giveUp); this.conn.send({t:"hello", name}); done(null); });
      this.conn.on("data", clientReceive);
      this.conn.on("error", ()=>done("Erreur de liaison avec l'h\u00f4te."));
      this.conn.on("close", ()=>{ UI.banner="La connexion avec l'h\u00f4te est perdue."; UI.render(); });
    });
  }
};
/* ---- messages re\u00e7us par l'h\u00f4te ---- */
function handleClient(pid, m){
  if(m.t==="start" && pid===0 && !Net.started){
    if(Net.slots.length<2) return;
    Net.started=true;
    newGame(Net.slots.map(s=>s.name), Net.mode);
    Net.broadcast({t:"go"});
    Net.pushAll();
    if(!TICK) TICK=setInterval(hostTick,1000);
    return;
  }
  if(m.t==="mode" && pid===0 && !Net.started){ if(MODES[m.mode]) Net.mode=m.mode; Net.lobbyPush(); UI.render(); return; }
  if(!G || G.over) return;
  const p=G.players[pid]; if(!p) return;
  switch(m.t){
    case "move":   if(!PEND[p.id] && !p.ready) doMove(p,m.zone); break;
    case "search": if(!p.ready) doSearch(p); return;
    case "act":    if(!p.ready) doAct(p,m.id); return;
    case "give":   doGive(p,m.to,m.item); break;
    case "med":    doMed(p,m.to); break;
    case "ready":  if(!p.ready) setReady(p); break;
    case "answer": submit(p,m.pid,m.value); return;
    case "chat": {
      const txt=String(m.text||"").slice(0,140).trim(); if(!txt) return;
      if(m.ping){ G.ping={zone:p.zone, name:p.name, at:Date.now()}; }
      Net.broadcast({t:"chat", from:p.name, id:p.id, text:txt, ping:!!m.ping, zone:m.ping? zn(p.zone):null});
      break;
    }
  }
  Net.pushAll();
}
function hostTick(){
  if(!G||G.over) return;
  G.time--;
  timeoutPuzzles();
  if(checkEnd()) { clearInterval(TICK); TICK=null; return; }
  Net.pushAll();
}
/* ---- messages re\u00e7us par un joueur ---- */
function clientReceive(m){
  switch(m.t){
    case "lobby": UI.lobby=m; UI.screen="lobby"; UI.render(); break;
    case "go":    UI.screen="game"; break;
    case "view": {
      const v=m.v; (v.notes||[]).forEach(t=>UI.note(t));
      const key=JSON.stringify([v.round,v.players,v.me,v.actions,v.moves,v.feed,v.world,v.zones.length,v.edges.length,v.ping]);
      const prev=UI.V; UI.V=v;
      SND.setZone(v.me.zone, v.world);
      if(prev){
        if(!!prev.world.storm !== !!v.world.storm) SND.setStorm(!!v.world.storm);
        if(prev.world.power !== v.world.power) SND.setPower(v.world.power);
      }
      if(UI.travelling){ UI.tickClock(); UI.lastKey=null; break; }     /* trac\u00e9 en cours : on ne reconstruit pas */
      if(UI.screen==="game" && key===UI.lastKey){ UI.tickClock(); }   /* seul le chrono bouge */
      else { UI.lastKey=key; UI.screen=UI.screen==="end"?"end":"game"; UI.render(); }
      break;
    }
    case "result": UI.flash(m.ok, m.late, m.code); break;
    case "sfx": if(m.zone) SND.at(m.k, m.zone, UI.V); else SND.play(m.k); break;
    case "chat":  UI.chatIn(m); break;
    case "puzzle":UI.openPuzzle(m); break;
    case "digit": SND.play("relais"); UI.showDigit(m); break;
    case "clue":  SND.play("relais"); UI.showClue(m); break;
    case "mutation": SND.play("mission"); UI.showMutation(m); break;
    case "end":   SND.stopAmb(); SND.play("extinction"); UI.results=m; UI.screen="end"; UI.closeVeil(); UI.render(); break;
    case "full":  UI.banner="La partie est compl\u00e8te ou d\u00e9j\u00e0 lanc\u00e9e."; UI.render(); break;
  }
}


/* ============ 7. AMBIANCE SONORE ============
   Tout est synth\u00e9tis\u00e9 : aucun fichier audio, aucune musique de fond.
   Trois bus : ambiances (fond continu), effets (actions), ma\u00eetre.        */
const SND = {
  ctx:null, master:null, ambBus:null, sfxBus:null, ready:false,
  vol:{master:0.75, sfx:1, amb:0.55}, muted:false,
  noiseBuf:null, layers:[], timers:[], zone:null, mods:{},

  init(){
    if(this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value=this.vol.master;
    this.master.connect(this.ctx.destination);
    this.ambBus = this.ctx.createGain(); this.ambBus.gain.value=this.vol.amb; this.ambBus.connect(this.master);
    this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value=this.vol.sfx; this.sfxBus.connect(this.master);
    /* une seule r\u00e9serve de bruit, r\u00e9utilis\u00e9e par toutes les couches */
    const len=this.ctx.sampleRate*3, b=this.ctx.createBuffer(1,len,this.ctx.sampleRate), dta=b.getChannelData(0);
    let last=0;
    for(let i=0;i<len;i++){ const wht=Math.random()*2-1; last=(last+0.02*wht)/1.02; dta[i]=last*3.2; }
    this.noiseBuf=b; this.ready=true;
    return true;
  },
  resume(){ if(this.ctx && this.ctx.state==="suspended") this.ctx.resume(); },
  setVol(k,v){ this.vol[k]=v; if(!this.ctx) return;
    this.master.gain.value = this.muted? 0 : this.vol.master;
    this.ambBus.gain.value = this.vol.amb; this.sfxBus.gain.value = this.vol.sfx; },
  mute(on){ this.muted=on; if(this.ctx) this.master.gain.value = on? 0 : this.vol.master; },

  /* --- briques --- */
  noise(){ const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf; s.loop=true; return s; },
  gain(v){ const g=this.ctx.createGain(); g.gain.value=v; return g; },
  filt(type,f,q){ const b=this.ctx.createBiquadFilter(); b.type=type; b.frequency.value=f; if(q)b.Q.value=q; return b; },
  pan(v){ if(!this.ctx.createStereoPanner) return null; const p=this.ctx.createStereoPanner(); p.pan.value=v; return p; },
  env(node, a, d, peak){ const t=this.ctx.currentTime;
    node.gain.setValueAtTime(0.0001,t);
    node.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t+a);
    node.gain.exponentialRampToValueAtTime(0.0001, t+a+d); },
  vary(v, p){ return v*(1+(Math.random()*2-1)*(p||0.12)); },

  /* --- effets ponctuels --- */
  burst(f, q, dur, peak, type, dest){
    if(!this.init()) return; this.resume();
    const s=this.noise(), b=this.filt(type||"bandpass", this.vary(f), q||6), g=this.gain(0.0001);
    s.connect(b); b.connect(g); g.connect(dest||this.sfxBus);
    this.env(g, 0.006, this.vary(dur), peak==null?0.35:peak);
    s.start(); s.stop(this.ctx.currentTime+dur+0.1);
  },
  tone(f0, f1, dur, peak, type, dest){
    if(!this.init()) return; this.resume();
    const o=this.ctx.createOscillator(), g=this.gain(0.0001);
    o.type=type||"sine"; const t=this.ctx.currentTime;
    o.frequency.setValueAtTime(this.vary(f0,0.03), t);
    if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(20,this.vary(f1,0.03)), t+dur);
    o.connect(g); g.connect(dest||this.sfxBus);
    this.env(g, 0.008, dur, peak==null?0.18:peak);
    o.start(); o.stop(t+dur+0.12);
  },

  /* --- biblioth\u00e8que d'effets, chacun avec ses variantes --- */
  fx:{
    clic(S,d){ S.burst(1400+Math.random()*900, 9, .045, .22, "bandpass", d); },
    interrupteur(S,d){ S.burst(900, 5, .05, .3, "bandpass", d); setTimeout(()=>S.burst(2200,8,.04,.18,"bandpass",d), 45); },
    levier(S,d){ S.tone(180, 90, .28, .16, "sawtooth", d); S.burst(600, 3, .3, .12, "lowpass", d); },
    validation(S,d){ S.tone(660, 880, .12, .18, "sine", d); setTimeout(()=>S.tone(990,1180,.16,.15,"sine",d), 90); },
    erreur(S,d){ S.tone(190, 120, .3, .2, "square", d); },
    bip(S,d){ S.tone(1500, 1500, .05, .14, "square", d); },
    message(S,d){ S.tone(880, 1240, .07, .12, "sine", d); },
    mission(S,d){ S.tone(520,780,.1,.14,"triangle",d); setTimeout(()=>S.tone(1040,1560,.12,.11,"triangle",d),110); },
    notification(S,d){ S.tone(420, 620, .16, .16, "triangle", d); },
    /* portes et m\u00e9canismes */
    porte(S,d){ S.burst(320, 2.5, .5, .3, "lowpass", d);
      setTimeout(()=>S.burst(1800, 7, .12, .22, "bandpass", d), 90);
      setTimeout(()=>S.tone(70, 45, .5, .2, "sine", d), 140); },
    verrou(S,d){ S.burst(2400, 10, .05, .3, "bandpass", d); setTimeout(()=>S.burst(1200,8,.07,.25,"bandpass",d), 70); },
    coulisse(S,d){ S.burst(500, 1.6, .9, .18, "bandpass", d); setTimeout(()=>S.burst(900,4,.15,.2,"bandpass",d), 820); },
    /* machines */
    demarrage(S,d){ S.tone(40, 120, 1.1, .22, "sawtooth", d); S.burst(300, 1.5, 1.2, .12, "lowpass", d); },
    extinction(S,d){ S.tone(120, 30, 1.4, .2, "sawtooth", d); },
    relais(S,d){ S.burst(1100, 12, .04, .2, "bandpass", d); },
    /* objets */
    objet(S,d){ S.burst(700, 4, .09, .2, "bandpass", d); },
    pose(S,d){ S.burst(240, 2, .14, .26, "lowpass", d); },
    batterie(S,d){ S.tone(300, 460, .09, .16, "square", d); S.burst(1600, 9, .05, .14, "bandpass", d); },
    papier(S,d){ S.burst(3200, 1.4, .22, .12, "highpass", d); },
    cle(S,d){ S.burst(2800, 14, .06, .22, "bandpass", d); setTimeout(()=>S.burst(2200,12,.05,.16,"bandpass",d), 60); },
    /* nature et \u00e9v\u00e9nements */
    pierres(S,d){ for(let i=0;i<7;i++) setTimeout(()=>S.burst(260+Math.random()*500, 3, .12, .22, "bandpass", d), i*70+Math.random()*60); },
    grondement(S,d){ S.tone(58, 28, 2.2, .3, "sine", d); S.burst(90, 1.2, 2.4, .18, "lowpass", d); },
    fuite(S,d){ S.burst(4200, 1.2, 1.8, .16, "highpass", d); },
    rafale(S,d){ S.burst(500, .9, 2.6, .3, "lowpass", d); },
    /* pas, par surface */
    pas_metal(S,d){ S.burst(1500+Math.random()*600, 7, .06, .16, "bandpass", d); },
    pas_pierre(S,d){ S.burst(700+Math.random()*400, 3.5, .07, .15, "bandpass", d); },
    pas_terre(S,d){ S.burst(320+Math.random()*180, 1.6, .09, .17, "lowpass", d); },
    pas_eau(S,d){ S.burst(1800+Math.random()*900, 1.1, .16, .16, "highpass", d); }
  },
  play(kind, opts){
    if(this.muted || !this.init()) return; this.resume();
    const f=this.fx[kind]; if(!f) return;
    let dest=this.sfxBus;
    if(opts && (opts.pan!=null || opts.far!=null)){
      const g=this.gain(opts.far!=null? Math.max(0.06, 1-opts.far) : 1);
      const p=this.pan(opts.pan||0);
      if(p){ g.connect(p); p.connect(this.sfxBus); } else g.connect(this.sfxBus);
      dest=g;
    }
    f(this, dest);
  },
  /* son situ\u00e9 : plus la zone est loin, plus il est discret et lat\u00e9ralis\u00e9 */
  at(kind, zoneId, V){
    if(!V || !V.zones) return this.play(kind);
    const a=V.zones.find(z=>z.id===V.me.zone), b=V.zones.find(z=>z.id===zoneId);
    if(!a||!b) return this.play(kind);
    if(a.id===b.id) return this.play(kind);
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    this.play(kind, { far:Math.min(0.92, d/70), pan:Math.max(-1,Math.min(1,(b.x-a.x)/45)) });
  },

  /* --- couches d'ambiance --- */
  cont(kind, vol, dest){
    const S=this, C=this.ctx; let src, node;
    const mkNoise=(type,f,q,lfoRate,lfoAmt)=>{
      src=S.noise(); const b=S.filt(type,f,q), g=S.gain(0);
      src.connect(b); b.connect(g); g.connect(dest);
      if(lfoRate){ const lfo=C.createOscillator(), la=S.gain(lfoAmt);
        lfo.frequency.value=lfoRate; lfo.connect(la); la.connect(g.gain); lfo.start();
        node={g, extra:lfo}; } else node={g};
      src.start(); return g;
    };
    const mkTone=(fs,type,f,q,trem)=>{
      const g=S.gain(0), b=S.filt("lowpass",f,q); b.connect(g); g.connect(dest);
      const oscs=fs.map(fr=>{ const o=C.createOscillator(); o.type=type; o.frequency.value=fr; o.connect(b); o.start(); return o; });
      if(trem){ const lfo=C.createOscillator(), la=S.gain(vol*0.8); lfo.frequency.value=trem;
        lfo.connect(la); la.connect(g.gain); lfo.start(); oscs.push(lfo); }
      node={g, oscs}; return g;
    };
    let g;
    switch(kind){
      case "wind":    g=mkNoise("lowpass", 420, .8, .07, vol*0.7); break;
      case "leaves":  g=mkNoise("bandpass", 2600, 1.2, .19, vol*0.6); break;
      case "air":     g=mkNoise("lowpass", 700, .7); break;
      case "hiss":    g=mkNoise("highpass", 3400, .8, .13, vol*0.4); break;
      case "water":   g=mkNoise("bandpass", 520, 1.1, .11, vol*0.5); break;
      case "rumble":  g=mkNoise("lowpass", 70, .9, .05, vol*0.5); break;
      case "hum":     g=mkTone([50,100.5],"sine", 320, 1); break;
      case "buzz":    g=mkTone([119,238],"sawtooth", 620, .8); break;
      case "throb":   g=mkTone([41,62],"sine", 200, 1, 1.6); break;
      case "drone":   g=mkTone([55,82.4],"triangle", 400, .9); break;
      case "pulse":   g=mkTone([196],"sine", 500, 1, .5); break;
      default: return null;
    }
    g.gain.setTargetAtTime(vol, this.ctx.currentTime, 1.2);
    return { g, node, src, stop(){
      g.gain.setTargetAtTime(0.0001, S.ctx.currentTime, .7);
      setTimeout(()=>{ try{ if(src) src.stop(); if(node.oscs) node.oscs.forEach(o=>o.stop()); if(node.extra) node.extra.stop(); }catch(e){} }, 2200);
    }};
  },
  spor(kind, everyMs, spread){
    const S=this;
    const t=setInterval(()=>{
      if(S.muted) return;
      const g=S.gain(S.vol.amb*0.5), p=S.pan(Math.random()*1.6-0.8);
      if(p){ g.connect(p); p.connect(S.ambBus); } else g.connect(S.ambBus);
      const f=S.fx[kind]; if(f) f(S, g);
    }, everyMs+Math.random()*(spread||everyMs));
    return t;
  },
  /* oiseaux, insectes, gouttes : de courtes touches, jamais identiques */
  extraFx(){
    const S=this;
    this.fx.oiseau=(s,d)=>{ const f=1800+Math.random()*1400; s.tone(f, f*1.5, .09, .1, "sine", d);
      setTimeout(()=>s.tone(f*1.3, f*0.9, .07, .07, "sine", d), 110); };
    this.fx.insecte=(s,d)=>{ s.burst(5200, 12, .5, .05, "bandpass", d); };
    this.fx.goutte=(s,d)=>{ const f=900+Math.random()*900; s.tone(f, f*0.4, .1, .12, "sine", d); };
    this.fx.craquement=(s,d)=>{ s.burst(380+Math.random()*300, 5, .18, .12, "bandpass", d); };
    this.fx.metal=(s,d)=>{ s.burst(2600+Math.random()*1200, 16, .5, .07, "bandpass", d); };
    this.fx.geiger=(s,d)=>{ s.burst(3000, 14, .02, .12, "bandpass", d); };
    this.fx.instrument=(s,d)=>{ s.tone(1200, 1200, .04, .06, "square", d); };
  },

  /* --- ambiance d'une zone --- */
  recipes:{
    camp:{cont:{wind:.20}, spor:{oiseau:9000, craquement:14000}},
    foret:{cont:{wind:.26, leaves:.20}, spor:{oiseau:6000, insecte:11000}},
    observatoire:{cont:{wind:.42}, spor:{metal:9000, instrument:7000}},
    meteo:{cont:{wind:.34}, spor:{instrument:5000, metal:12000}},
    labo:{cont:{hum:.16, air:.10}, spor:{relais:7000, goutte:15000}},
    mine:{cont:{rumble:.20, air:.08}, spor:{goutte:4000, craquement:9000}, echo:.35},
    centre:{cont:{wind:.16}, spor:{craquement:6000, metal:13000}},
    contam:{cont:{hiss:.16, air:.08}, spor:{geiger:1400}},
    bunker:{cont:{hum:.12, air:.14}, spor:{metal:10000, goutte:12000}, echo:.25},
    grottes:{cont:{rumble:.14, air:.06}, spor:{goutte:2600}, echo:.5},
    centrale:{cont:{throb:.18, buzz:.10}, spor:{relais:5000}},
    village:{cont:{wind:.18, water:.16}, spor:{craquement:7000, goutte:9000}},
    complexe:{cont:{drone:.16, air:.12}, spor:{metal:11000, goutte:8000}, echo:.55},
    vallee:{cont:{wind:.30}, spor:{insecte:6000, oiseau:12000}},
    crete:{cont:{wind:.50}, spor:{metal:15000}},
    structure:{cont:{drone:.20, pulse:.10}, spor:{metal:9000}, echo:.6}
  },
  surface(id){
    if(["labo","bunker","centrale","complexe","structure","meteo","observatoire"].indexOf(id)>=0) return "pas_metal";
    if(["mine","grottes","crete"].indexOf(id)>=0) return "pas_pierre";
    if(id==="village") return "pas_eau";
    return "pas_terre";
  },
  setZone(id, world){
    if(!this.init() || this.zone===id) return;
    this.resume();
    if(!this.fx.oiseau) this.extraFx();
    this.stopAmb();
    this.zone=id;
    const r=this.recipes[id]; if(!r) return;
    let dest=this.ambBus;
    if(r.echo){ const dl=this.ctx.createDelay(1.2), fb=this.gain(r.echo*0.55), wet=this.gain(r.echo);
      dl.delayTime.value=0.28; dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(this.ambBus);
      const inG=this.gain(1); inG.connect(this.ambBus); inG.connect(dl); dest=inG; this.layers.push({stop(){ try{ fb.disconnect(); dl.disconnect(); }catch(e){} }}); }
    this.ambDest=dest;
    for(const k in r.cont){
      let v=r.cont[k];
      if((k==="hum"||k==="buzz"||k==="throb") && world && !world.power) v*=0.12;
      const L=this.cont(k, v, dest); if(L){ L.kind=k; this.layers.push(L); }
    }
    for(const k in r.spor) this.timers.push(this.spor(k, r.spor[k], r.spor[k]*0.8));
    if(world && world.storm) this.setStorm(true);
  },
  stopAmb(){ this.layers.forEach(l=>{ try{ l.stop(); }catch(e){} }); this.layers=[];
    this.timers.forEach(t=>clearInterval(t)); this.timers=[]; },
  setStorm(on){
    const w=this.layers.find(l=>l.kind==="wind");
    if(w) w.g.gain.setTargetAtTime(on? 0.75 : (this.recipes[this.zone]&&this.recipes[this.zone].cont.wind)||0.2, this.ctx.currentTime, on?2.5:3);
    if(on) this.play("rafale");
  },
  setPower(on){
    ["hum","buzz","throb"].forEach(k=>{ const l=this.layers.find(x=>x.kind===k);
      if(l){ const base=this.recipes[this.zone].cont[k]; l.g.gain.setTargetAtTime(on? base : base*0.12, this.ctx.currentTime, 1.6); } });
    this.play(on? "demarrage" : "extinction");
  }
};

 map(){
   const V=this.V, me=V.me, ns="http://www.w3.org/2000/svg", UIx=this;
   const PC=["var(--p0)","var(--p1)","var(--p2)","var(--p3)","var(--p4)","var(--p5)","var(--p6)","var(--p7)"];
   const H=V.mapH||104;
   const svg=document.createElementNS(ns,"svg");
   svg.setAttribute("viewBox","0 0 100 "+H); svg.setAttribute("class","topo");
   const mk=(tag,attrs,cls)=>{ const e=document.createElementNS(ns,tag);
     for(const k in attrs) e.setAttribute(k,attrs[k]); if(cls) e.setAttribute("class",cls); return e; };

   for(let i=0;i<7;i++){ const c=mk("ellipse",{cx:50+Math.sin(i)*12, cy:H/2+Math.cos(i)*10,
     rx:12+i*7, ry:(9+i*6)*H/104},"contour"); c.style.animationDelay=(i*1.3)+"s"; svg.appendChild(c); }
   const sc=mk("line",{x1:0,y1:0,x2:100,y2:0},"scan"); svg.appendChild(sc);

     if(this.freshEdges && this.freshEdges[e[0]+e[1]]) cls+=" fresh";
     if(this.usedEdge===e[0]+e[1] || this.usedEdge===e[1]+e[0]) cls+=" used";

   const from=Z[me.zone], cost=(V.world.storm?2:1);

   V.zones.forEach(z=>{

     const here=me.zone===z.id, mv=V.moves[z.id];
     let cls="node"; if(here) cls+=" here"; else if(mv&&mv.ok) cls+=" go seen"; else if(mv) cls+=" shut"; else cls+=" far";
     if(V.ping && V.ping.zone===z.id) cls+=" ping";
     if(this.moved && this.moved[z.id]) cls+=" moved";
     if(!V.world.power && (z.id==="labo"||z.id==="observatoire"||z.id==="centrale")) cls+=" dim";
     g.setAttribute("class",cls);
     g.appendChild(mk("circle",{cx:z.x, cy:z.y, r:here?3.6:2.8}));
     const t=mk("text",{x:z.x, y:z.y-4.6}); t.textContent=z.n.toUpperCase(); g.appendChild(t);
     if(z.hazard>0){ const h=mk("text",{x:z.x, y:z.y+1.1},"warn"); h.textContent="!"; g.appendChild(h); }

     /* marqueurs : un cercle color\u00e9 par joueur, jamais de dessin */
     const occ=V.players.filter(q=>q.zone===z.id);
     occ.forEach((q,i)=>{
       const sp=occ.length>4? 2.4 : 3.2;

       let mcls="mk"; if(q.busy) mcls+=" busy";

       if(q.id===me.id) gm.appendChild(mk("circle",{cx:gx, cy:gy, r:2.2, stroke:PC[q.id%4]},"halo"));
       if(q.busy) gm.appendChild(mk("circle",{cx:gx, cy:gy, r:1.9, stroke:PC[q.id%4]},"ring"));

       gm.appendChild(bd); g.appendChild(gm);
     });

     const info=()=>{
       const occ2=occ.map(q=>q.name).join(", ");
       return "<b>"+z.n+"</b>"+(z.hazard? "Zone dangereuse\u2009\u2014\u2009on y perd des points de vie.<br>":"")
         +(occ2? "Sur place : "+occ2+"<br>":"")
         +(here? "Vous \u00eates ici. Glissez d'ici vers une voisine."
           : mv? (mv.ok? "Accessible \u2014 "+cost+" action. Glissez jusqu'ici." : mv.why)
           : "Hors de port\u00e9e depuis votre position.");
     };
     g.addEventListener("pointerenter", ev=>{
       if(!tip || UIx.travelling) return;
       tip.innerHTML=info();
       const r=$("#mapBox").getBoundingClientRect();
       tip.style.left=Math.min(r.width-230, Math.max(4, z.x/100*r.width-110))+"px";
       tip.style.top=Math.max(4, z.y/H*r.height-70)+"px";
       tip.classList.add("on");
     });
     g.addEventListener("pointerleave", ()=>{ if(tip) tip.classList.remove("on"); });
     g.onclick=()=>{ if(Date.now()-(UIx.lastTravel||0)<400) return;
       UIx.note(z.n+" \u2014 "+(here? "vous \u00eates ici." : mv? (mv.ok? "accessible, glissez jusqu'ici." : mv.why) : "hors de port\u00e9e.")); };
     svg.appendChild(g); });

     const hp=mk("text",{x:from.x, y:from.y+10.8},"hint"); hp.textContent="glissez pour marcher"; svg.appendChild(hp);
   }

   const layer=mk("g",{}); svg.appendChild(layer);

   const toSvg=ev=>{ const r=svg.getBoundingClientRect();
     return { x:(ev.clientX-r.left)/r.width*100, y:(ev.clientY-r.top)/r.height*H }; };
   const project=(p,a,b)=>{ const vx=b.x-a.x, vy=b.y-a.y, L2=vx*vx+vy*vy||1;

     return { t, d:Math.hypot(p.x-(a.x+vx*t), p.y-(a.y+vy*t)) }; };
   const corridor = V.world.storm? 3.4 : 5;
   const rate = 1/(1000 + (V.world.storm?450:0) + (me.hp<=1?450:0) + (me.dead?600:0));
   let T=null, T2=null;

   const draw=()=>{
     clear(); if(!T||!T.to) return;
     const b=T.to;
     layer.appendChild(mk("line",{x1:from.x,y1:from.y,x2:b.x,y2:b.y},"tline"));
     const px=from.x+(b.x-from.x)*T.prog, py=from.y+(b.y-from.y)*T.prog;
     layer.appendChild(mk("line",{x1:from.x,y1:from.y,x2:px,y2:py},"tprog"+(T.off?" off":"")));
     layer.appendChild(mk("circle",{cx:px,cy:py,r:2},"tdot"+(T.off?" off":"")));
     const lb=mk("text",{x:(from.x+b.x)/2, y:(from.y+b.y)/2-3.4},"tlabel"+(T.off?" off":""));
     lb.textContent = T.off? "revenez sur la piste" : b.n.toUpperCase()+"  "+Math.round(T.prog*100)+"%";
     layer.appendChild(lb);
   };
   const step=()=>{
     if(!T){ T2=null; return; }
     const now=performance.now(), dt=Math.min(120, now-T.last); T.last=now;
     if(T.to && T.pt){
       const pr=project(T.pt, from, T.to);
       T.off = pr.d>corridor;
       if(!T.off) T.prog = Math.max(0, Math.min(pr.t, T.prog + dt*rate));
       if(!T.off && T.prog - (T.lastStep||0) > 0.14){ T.lastStep=T.prog;
         SND.play(SND.surface(T.to.id), {pan:(T.to.x-50)/60}); }
       draw();
       if(T.prog>=0.97){
         const id=T.to.id; T=null; UIx.travelling=false; UIx.lastTravel=Date.now(); clear();
         UIx.usedEdge=me.zone+id; setTimeout(()=>{ UIx.usedEdge=null; },4000);
         SND.play(SND.surface(id));
         Net.send({t:"move", zone:id});
         return;
       }
     }
     T2=requestAnimationFrame(step);
   };
   svg.addEventListener("pointerdown", ev=>{
     if(!from || me.ready) return;
     const p=toSvg(ev);
     if(Math.hypot(p.x-from.x,p.y-from.y)>7) return;
     if(!openTargets.length) return UIx.note("Aucune zone accessible depuis ici.");
     if(me.ap<cost) return UIx.note("Il vous faut "+cost+" action(s) pour marcher.");
     if(tip) tip.classList.remove("on");
     T={to:null, prog:0, last:performance.now(), off:false, pt:p};
     UIx.travelling=true;
     if(T2) cancelAnimationFrame(T2);
     T2=requestAnimationFrame(step);
     try{ svg.setPointerCapture(ev.pointerId); }catch(e){}
     ev.preventDefault();
   });
   svg.addEventListener("pointermove", ev=>{
     if(!T) return;
     const p=toSvg(ev); T.pt=p;
     if(!T.to){
       if(Math.hypot(p.x-from.x,p.y-from.y)<3.2) return;
       let best=null, bd=1e9;
       V.zones.forEach(z=>{ if(!V.moves[z.id]) return; const d=project(p,from,z).d; if(d<bd){ bd=d; best=z; } });
       if(!best) return;
       const mv=V.moves[best.id];
       if(!mv.ok){ T=null; UIx.travelling=false; clear(); UIx.note(best.n+" \u2014 "+mv.why); return; }
       T.to=best; SND.play("interrupteur");
     }
     ev.preventDefault();
   });
   const stop=()=>{ if(T2){ cancelAnimationFrame(T2); T2=null; } if(!T) return;
     const p=T.prog; T=null; UIx.travelling=false; UIx.lastTravel=Date.now(); clear();
     if(p>0.08) UIx.note("Trajet interrompu : vous n'avez pas quitt\u00e9 la zone.");
     if(UIx.lastKey===null) UIx.render(); };
   svg.addEventListener("pointerup", stop);
   svg.addEventListener("pointercancel", stop);
   return svg;
 },

/* ---- atelier : simulation et classement automatique des \u00e9preuves ---- */
UI.lab = function(){
  const s=this.openVeil();
  s.appendChild(el("div","eyebrow","atelier des \u00e9preuves \u00b7 simulation"));
  s.appendChild(el("h2","","Mesurer la difficult\u00e9 r\u00e9elle"));
  s.appendChild(el("p","note","Quatre profils simul\u00e9s (novice, occasionnel, bon, expert) tentent chaque \u00e9preuve : "
    +"vitesse de r\u00e9flexion, empan de m\u00e9moire, pr\u00e9cision, temps de r\u00e9action et taux d'erreur diff\u00e9rents. "
    +"Le verdict est calcul\u00e9 sur les r\u00e9sultats, pas d\u00e9cid\u00e9 \u00e0 la main."));
  const row=el("div","row");
  const bar=el("div","bar"); const fill=el("div"); fill.style.width="0%"; bar.appendChild(fill);
  const st=el("div","note center","");
  const out=el("div","lab"); out.style.cssText="overflow:auto;max-height:52vh";
  let rows=[];
  const verdict=f=> f==="IDEAL"? "zone id\u00e9ale" : f==="NEEDS_REWORK"? "\u26a0 trop facile" : f==="TOO_HARD"? "\u26a0 trop dure" : "correcte";
  const draw=()=>{
    rows.sort((a,b)=>b.score-a.score);
    const pc=v=>Math.round(v*100)+"%";
    let h="<table><tr><th>\u00e9preuve</th><th>famille</th><th>palier</th><th>nov.</th><th>occ.</th><th>bon</th><th>exp.</th>"
      +"<th>t.m\u00e9d</th><th>err</th><th>limite</th><th>score</th><th>verdict</th><th>conseill\u00e9</th></tr>";
    rows.forEach(r=>{ const p=r.prof;
      h+="<tr><td>"+(PZ[r.kind]?PZ[r.kind].name:r.kind)+"</td><td>"+(FAMS[r.fam]||r.fam)
        +(r.fam2? "+"+(FAMS[r.fam2]||r.fam2):"")+"</td><td>"+TIER_NAME[r.tier-1]+"</td>"
        +"<td>"+pc(p.NOVICE.succ)+"</td><td>"+pc(p.CASUAL.succ)+"</td><td>"+pc(p.GOOD.succ)+"</td><td>"+pc(p.EXPERT.succ)+"</td>"
        +"<td>"+(p.GOOD.med||0).toFixed(0)+" s</td><td>"+p.CASUAL.err.toFixed(2)+"</td><td>"+r.limit+" s</td>"
        +"<td>"+r.score.toFixed(1)+"</td><td><span class='f "+r.flag+"'>"+verdict(r.flag)+"</span></td>"
        +"<td>"+r.recSec+" s</td></tr>"; });
    out.innerHTML=h+"</table>";
  };
  const apply=this.btn("Appliquer les temps conseill\u00e9s","wide",()=>{
    rows.forEach(r=>{ CAL[r.kind]=CAL[r.kind]||[]; CAL[r.kind][r.tier-1]=r.recSec; });
    st.textContent="Temps recalibr\u00e9s pour cette partie ("+Object.keys(CAL).length+" \u00e9preuves).";
  });
  const dump=this.btn("Exporter le tableau","wide",()=>{
    const t={}; rows.forEach(r=>{ t[r.kind]=t[r.kind]||[null,null,null,null]; t[r.kind][r.tier-1]=r.recSec; });
    const ta=el("textarea"); ta.value="const CAL_DATA = "+JSON.stringify(t)+";";
    ta.style.cssText="width:100%;height:90px;font-family:var(--mono);font-size:11px"; s.insertBefore(ta,out); ta.select();
  });
  const run=N=>{
    rows=[]; out.innerHTML=""; LABMODE=true;
    const jobs=[]; [...new Set([].concat(...POOLS))].filter(k=>PZ[k]).forEach(k=>{
      for(let t=1;t<=4;t++) if(POOLS[t-1].indexOf(k)>=0) jobs.push([k,t]); });
    let i=0; const t0=Date.now();
    const step=()=>{
      const end=Math.min(jobs.length, i+2);
      for(; i<end; i++){ try{ rows.push(evaluate(jobs[i][0], jobs[i][1], N)); }catch(e){} }
      fill.style.width=(i/jobs.length*100)+"%";
      st.textContent=i+" / "+jobs.length+" \u00e9preuves \u00b7 "+(N*4)+" tentatives chacune";
      if(i<jobs.length) setTimeout(step,0);
      else { LABMODE=false; draw();
        const bad=rows.filter(r=>r.flag==="NEEDS_REWORK").length, hard=rows.filter(r=>r.flag==="TOO_HARD").length;
        st.textContent=jobs.length+" \u00e9preuves test\u00e9es en "+((Date.now()-t0)/1000).toFixed(1)+" s \u00b7 "
          +rows.filter(r=>r.flag==="IDEAL").length+" en zone id\u00e9ale, "+bad+" trop faciles, "+hard+" trop dures."; }
    };
    step();
  };
  [100,500,1000].forEach(n=>row.appendChild(this.btn(n+" tentatives","mini",()=>run(n))));
  s.appendChild(row); s.appendChild(bar); s.appendChild(st); s.appendChild(out);
  const r2=el("div","row"); r2.appendChild(apply); r2.appendChild(dump); s.appendChild(r2);
  s.appendChild(this.btn("Fermer","primary wide",()=>this.closeVeil()));
};

      prog.textContent=(got.length+1)+" / "+u.items.length; };
    u.options.forEach((nm,i)=>{ const c=el("div","cell"+(u.big?" big":""),nm);
      c.onclick=()=>{ got.push(i); SND.play("clic");
        if(got.length===u.items.length) send(got); else show(); };
      g.appendChild(c); });
    body.appendChild(g); show();
  }
  else if(u.type==="fillgrid"){
    const cols=u.cols, extra=u.rows?1:0, rows=Math.ceil(u.start.length/cols);
    const g=grid(cols+extra,"4px"); const state=u.start.map(c=>c.v);
    const paints=[];
    if(u.colsHint){ if(extra) g.appendChild(el("div"));
      u.colsHint.forEach(h=>{ const c=el("div","hint"); c.textContent=h; g.appendChild(c); }); }
    for(let y=0;y<rows;y++){
      if(u.rows){ const h=el("div","hint"); h.textContent=u.rows[y]; g.appendChild(h); }
      for(let x=0;x<cols;x++){ const i=y*cols+x;
        if(i>=u.start.length){ g.appendChild(el("div")); continue; }
        const st=u.start[i], c=el("div","cell"); c.style.padding="13px 0";
        const paint=()=>{ c.className="cell"+(state[i]?" ok":"")+(st.lock?" lk":"");
          c.textContent = st.label!=null? st.label : (state[i]? "\u25A0" : "\u00b7"); };
        if(!st.lock) c.onclick=()=>{ state[i]=state[i]?0:1; paint(); info(); SND.play("clic"); };
        paints.push(paint); paint(); g.appendChild(c); }
    }
    body.appendChild(g);
    const nfo=el("div","note center"); body.appendChild(nfo);
    const info=()=>{ if(u.mode==="sum"){ let t=0, k=0; state.forEach((v,i)=>{ if(v){ t+=u.weights[i]; k++; } });
        nfo.textContent="charg\u00e9 : "+t+" / "+u.target+" kg"+(u.count? "   \u00b7   "+k+" / "+u.count+" caisses":""); }
      else nfo.textContent="cases allum\u00e9es : "+state.filter(v=>v).length; };
    info();
    body.appendChild(this.btn("Valider","primary wide",()=>send(state.slice())));
  }
  else if(u.type==="timing"){
    const track=el("div");
    track.style.cssText="position:relative;height:58px;background:var(--panel2);border:1px solid var(--line);overflow:hidden";
    const zone=el("div"); zone.style.cssText="position:absolute;top:0;bottom:0;background:#1F3A22;border-left:1px solid var(--lichen);border-right:1px solid var(--lichen)";
    const cur=el("div"); cur.style.cssText="position:absolute;top:0;bottom:0;width:3px;background:var(--amber)";
    track.appendChild(zone); track.appendChild(cur); body.appendChild(track);
    const prog=el("div","note center"); body.appendChild(prog);
    let round=0, w=u.width, x=ri(5,90), dir=1, raf=null, last=performance.now(), zx=0, live=true;
    const place=()=>{ zx=4+Math.random()*(92-w); zone.style.left=zx+"%"; zone.style.width=w+"%";
      prog.textContent="r\u00e9ussi : "+round+" / "+u.rounds; };
    place();
    const loop=()=>{ const now=performance.now(), dt=Math.min(80,now-last); last=now;
      x+=dir*u.speed*dt/1000; if(x>98){ x=98; dir=-1; } if(x<2){ x=2; dir=1; }
      cur.style.left=x+"%"; raf=requestAnimationFrame(loop); };
    const tap=()=>{ if(!live) return;
      if(x>=zx && x<=zx+w){ SND.play("clic"); round++;
        if(round>=u.rounds){ live=false; cancelAnimationFrame(raf); return send("ok"); }
        w=Math.max(4,w*0.88); place(); }
      else { live=false; cancelAnimationFrame(raf); track.style.borderColor="var(--rust)";
        prog.textContent="rat\u00e9"; setTimeout(()=>send("x"),420); } };
    track.onclick=tap;
    body.appendChild(this.btn("ARR\u00caTER","primary wide",tap));
    raf=requestAnimationFrame(loop);
    this.pzExtra=()=>cancelAnimationFrame(raf);
  }
  else body.appendChild(el("div","note","\u00c9preuve inconnue."));
};
["pointerdown","keydown"].forEach(e=>document.addEventListener(e, function once(){
  SND.init(); SND.resume(); document.removeEventListener(e, once);
}));
if(location.search.indexOf("lab")>=0) setTimeout(()=>UI.lab(),300);
UI.render();
</script>
