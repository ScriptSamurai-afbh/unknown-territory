  head.appendChild(el("span","tier t"+m.tier, TIER_NAME[m.tier-1]));
  s.appendChild(head);
  if(m.instr) s.appendChild(el("div","quest",m.instr));
  const bar=el("div","bar"); const fill=el("div"); fill.style.width="100%"; bar.appendChild(fill); s.appendChild(bar);
  const cd=el("div","count"); cd.textContent=m.seconds+" s"; s.appendChild(cd);
  const body=el("div"); s.appendChild(body);

  let done=false, t=m.seconds;
  const send=v=>{ if(done) return; done=true; clearInterval(this.pzTimer); this.pzTimer=null;
    if(this.pzExtra){ try{ this.pzExtra(); }catch(e){} this.pzExtra=null; }
    this.closeVeil(); Net.send({t:"answer", pid:m.pid, value:v}); };
  this.pzTimer=setInterval(()=>{ t--; cd.textContent=Math.max(0,t)+" s"; fill.style.width=Math.max(0,t/m.seconds*100)+"%";
    if(t<=5){ cd.classList.add("low"); if(t>0) SND.play("bip"); }
    if(t<=0) send(null); },1000);

  const u=m.ui, grid=(cols,gap)=>{ const g=el("div","grid"); g.style.gridTemplateColumns="repeat("+cols+",1fr)";
    if(gap) g.style.gap=gap; return g; };

  if(u.type==="choice"){
    const g=grid(u.wide?1:Math.min(u.options.length,4));
    u.options.forEach((o,i)=>{ const c=el("div","cell"+(u.wide?" txt":" big"),o);
      c.onclick=()=>{ c.classList.add("sel"); send(i); }; g.appendChild(c); });
    body.appendChild(g);
  }
  else if(u.type==="cells"){
    const g=grid(u.cols,"3px");
    u.cells.forEach((sym,i)=>{ const c=el("div","cell",sym); c.style.cssText="padding:8px 0;font-size:15px";
      c.onclick=()=>{ c.classList.add("sel"); send(i); }; g.appendChild(c); });
    body.appendChild(g);
  }
  else if(u.type==="order"){
    const g=grid(u.words? 3 : Math.min(u.values.length,4)); const got=[];
    u.values.forEach(v=>{ const c=el("div","cell"+(u.words?" txt":" big"),String(v));
      if(u.words) c.style.textAlign="center";
      c.onclick=()=>{ if(c.classList.contains("ok")) return; c.classList.add("ok"); got.push(v);
        if(got.length===u.values.length) send(got); }; g.appendChild(c); });
    body.appendChild(g);
  }
  else if(u.type==="pairs"){
    const q=el("div","cell txt", u.order.join("   \u00b7   ")); q.style.cursor="default"; q.style.marginBottom="8px"; body.appendChild(q);
    const g=grid(u.symbols.length); const got=[];
    u.symbols.forEach(sym=>{ const c=el("div","cell big",sym);
      c.onclick=()=>{ if(c.classList.contains("ok")) return; c.classList.add("ok"); got.push(sym);
        if(got.length===u.order.length) send(got); }; g.appendChild(c); });
    body.appendChild(g);
  }
  else if(u.type==="memory"){
    const g=grid(u.cols); const cells=[];
    for(let i=0;i<u.cells;i++){ const c=el("div","cell big mem-cell","\u00b7"); g.appendChild(c); cells.push(c); }
    body.appendChild(g);
    const hint=el("div","note center","Regardez\u2026"); body.appendChild(hint);
    let k=0; const show=()=>{ if(k>=u.seq.length){ hint.textContent="\u00c0 vous : reproduisez la suite."; return arm(); }
      const c=cells[u.seq[k]]; c.classList.add("sel");
      setTimeout(()=>{ c.classList.remove("sel"); k++; setTimeout(show, Math.max(90,u.speed*0.3)); }, u.speed); };
    const arm=()=>{ const got=[]; cells.forEach((c,i)=>{ c.onclick=()=>{ got.push(i); c.classList.add("ok");
      setTimeout(()=>c.classList.remove("ok"),160); if(got.length===u.seq.length) send(got); }; }); };
    setTimeout(show,500);
  }
  else if(u.type==="switch"){
    const lamps=grid(u.start.length), sw=grid(u.start.length);
    body.appendChild(lamps);
    const lab=el("div","note center","boutons"); lab.style.margin="10px 0 6px"; body.appendChild(lab);
    body.appendChild(sw);
    let st=u.start.slice(); const presses=[]; const cells=[];
    for(let i=0;i<st.length;i++){ const c=el("div","cell big"); lamps.appendChild(c); cells.push(c); }
    const draw=()=>cells.forEach((c,i)=>{ c.className="cell big "+(st[i]?"ok":""); c.textContent=st[i]?"\u25CF":"\u25CB"; });
    for(let i=0;i<st.length;i++){ const b=el("div","cell",String(i+1));
      b.onclick=()=>{ u.links[i].forEach(j=>st[j]=!st[j]); presses.push(i); draw();
        if(st.every(v=>v)) setTimeout(()=>send(presses),180); }; sw.appendChild(b); }
    draw();
  }
  else if(u.type==="path"){
    const N=u.grid.length, g=grid(N,"4px"); const path=[[0,0]]; const cells=[];
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const blocked=u.grid[y][x], c=el("div","cell"+(blocked?" bad":""), blocked?"\u25A0":(x===N-1&&y===N-1?"\u2691":""));
      c.style.padding="12px 0";
      c.onclick=()=>{ if(blocked) return; const [lx,ly]=path[path.length-1];
        if(Math.abs(lx-x)+Math.abs(ly-y)!==1) return;
        path.push([x,y]); c.classList.add("sel");
        if(x===N-1&&y===N-1) setTimeout(()=>send(path),150); };
      cells.push(c); g.appendChild(c); }
    cells[0].classList.add("sel"); body.appendChild(g);
  }
  else if(u.type==="reflex"){
    const pad=el("div","reflex","ATTENDEZ\u2026"); body.appendChild(pad);
    const score=el("div","note center"); body.appendChild(score);
    let hits=0, armed=false, tStart=0, to=null;
    const next=()=>{ if(hits>=u.rounds) return send("ok");
      score.textContent="R\u00e9ussis : "+hits+" / "+u.rounds;
      pad.className="reflex"; pad.textContent="ATTENDEZ\u2026"; armed=false;
      to=setTimeout(()=>{ armed=true; tStart=Date.now(); pad.className="reflex go"; pad.textContent="MAINTENANT";
        to=setTimeout(()=>{ if(armed){ fail("Trop lent."); } }, u.win); }, 700+Math.random()*1900); };
    const fail=msg=>{ clearTimeout(to); pad.className="reflex miss"; pad.textContent=msg; setTimeout(()=>send("x"),500); };
    pad.onclick=()=>{ if(!armed) return fail("Trop t\u00f4t !");
      clearTimeout(to); armed=false; hits++;
      pad.className="reflex"; pad.textContent=(Date.now()-tStart)+" ms";
      setTimeout(next,420); };
    next();
  }
  else if(u.type==="code"){
    const disp=el("div","code-big"); disp.style.minHeight="44px"; body.appendChild(disp);
    const g=grid(3); let buf=[];
    for(let k=1;k<=9;k++){ const c=el("div","cell big",String(k));
      c.onclick=()=>{ if(buf.length>=u.len) return; buf.push(k); disp.textContent=buf.join(" ");
        if(buf.length===u.len) setTimeout(()=>send(buf),150); }; g.appendChild(c); }
    const cl=el("div","cell","effacer"); cl.onclick=()=>{ buf=[]; disp.textContent=""; }; g.appendChild(cl);
    body.appendChild(g);
  }
  else if(u.type==="cables"){
    const n2=u.left.length, H=n2*26+10, NS="http://www.w3.org/2000/svg";
    const sv=document.createElementNS(NS,"svg");
    sv.setAttribute("viewBox","0 0 100 "+H); sv.style.cssText="width:100%;height:auto;touch-action:none;background:var(--panel2);border:1px solid var(--line)";
    const el2=(t,a,c)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(c)e.setAttribute("class",c); return e; };
    const ly=(i)=>18+i*26;
    const links=new Array(n2).fill(-1);
    const wires=document.createElementNS(NS,"g"); sv.appendChild(wires);
    u.left.forEach((v,i)=>{ sv.appendChild(el2("circle",{cx:16,cy:ly(i),r:5,fill:"#222D21",stroke:"#4C5D46"}));
      const t=el2("text",{x:16,y:ly(i)+3.5,"text-anchor":"middle",fill:"#EDE9DC","font-size":"11","font-family":"monospace"}); t.textContent=v; sv.appendChild(t); });
    u.right.forEach((v,i)=>{ sv.appendChild(el2("circle",{cx:84,cy:ly(i),r:5,fill:"#222D21",stroke:"#4C5D46"}));
      const t=el2("text",{x:84,y:ly(i)+3.5,"text-anchor":"middle",fill:"#EDE9DC","font-size":"11","font-family":"monospace"}); t.textContent=v; sv.appendChild(t); });
    let drag=null;
    const pt=ev=>{ const r=sv.getBoundingClientRect(); return {x:(ev.clientX-r.left)/r.width*100, y:(ev.clientY-r.top)/r.height*H}; };
    const redraw=(tmp)=>{ while(wires.firstChild) wires.removeChild(wires.firstChild);
      links.forEach((r,i)=>{ if(r<0) return;
        wires.appendChild(el2("line",{x1:21,y1:ly(i),x2:79,y2:ly(r),stroke:"#E5A94A","stroke-width":2})); });
      if(tmp) wires.appendChild(el2("line",{x1:21,y1:ly(tmp.i),x2:tmp.x,y2:tmp.y,stroke:"#86B36B","stroke-width":2,"stroke-dasharray":"4 3"})); };
    sv.addEventListener("pointerdown",ev=>{ const p=pt(ev);
      if(p.x>30) return; let i=Math.round((p.y-18)/26);
      if(i<0||i>=n2) return; drag={i}; ev.preventDefault();
      try{ sv.setPointerCapture(ev.pointerId); }catch(e){} });
    sv.addEventListener("pointermove",ev=>{ if(!drag) return; const p=pt(ev); redraw({i:drag.i,x:p.x,y:p.y}); });
    const done=ev=>{ if(!drag) return; const p=pt(ev);
      let j=Math.round((p.y-18)/26);
      if(p.x>60 && j>=0 && j<n2){ links.forEach((r,k)=>{ if(r===j) links[k]=-1; }); links[drag.i]=j; }
      drag=null; redraw();
      if(links.every(r=>r>=0)) setTimeout(()=>send(links),200); };
    sv.addEventListener("pointerup",done); sv.addEventListener("pointercancel",()=>{drag=null;redraw();});
    body.appendChild(sv);
  }
  else if(u.type==="dial"){
    const wrap=el("div","dial"); const NS="http://www.w3.org/2000/svg";
    const sv=document.createElementNS(NS,"svg"); sv.setAttribute("viewBox","0 0 100 100");
    sv.style.cssText="width:100%;height:100%;touch-action:none";
    const e2=(t,a)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
    sv.appendChild(e2("circle",{cx:50,cy:50,r:42,fill:"#1B261C",stroke:"#2C3A2E","stroke-width":2}));
    for(let i=0;i<20;i++){ const a=i/20*Math.PI*2-Math.PI/2;
      sv.appendChild(e2("line",{x1:50+Math.cos(a)*36,y1:50+Math.sin(a)*36,x2:50+Math.cos(a)*41,y2:50+Math.sin(a)*41,
        stroke:"#4C5D46","stroke-width":1})); }
    const needle=e2("line",{x1:50,y1:50,x2:50,y2:12,stroke:"#E5A94A","stroke-width":3,"stroke-linecap":"round"});
    sv.appendChild(needle); sv.appendChild(e2("circle",{cx:50,cy:50,r:4,fill:"#E5A94A"}));
    wrap.appendChild(sv); body.appendChild(wrap);
    const read=el("div","count"); read.textContent="0"; body.appendChild(read);
    const goal=el("div","note center","cible : "+u.show+"  \u00b7  \u00b1"+u.tol); body.appendChild(goal);
    let val=0, on=false;
    const set=v=>{ val=((v%100)+100)%100; const a=val/100*Math.PI*2-Math.PI/2;
      needle.setAttribute("x2",50+Math.cos(a)*38); needle.setAttribute("y2",50+Math.sin(a)*38);
      read.textContent=val; read.style.color=Math.abs(val-u.show)<=u.tol? "var(--lichen)":"var(--bone)"; };
    const ang=ev=>{ const r=sv.getBoundingClientRect();
      const dx=ev.clientX-(r.left+r.width/2), dy=ev.clientY-(r.top+r.height/2);
      return Math.round(((Math.atan2(dy,dx)+Math.PI/2)/(Math.PI*2)*100+100))%100; };
    sv.addEventListener("pointerdown",ev=>{ on=true; set(ang(ev)); ev.preventDefault();
      try{ sv.setPointerCapture(ev.pointerId); }catch(e){} });
    sv.addEventListener("pointermove",ev=>{ if(on) set(ang(ev)); });
    ["pointerup","pointercancel"].forEach(e=>sv.addEventListener(e,()=>on=false));
    set(0);
    body.appendChild(UI.lever("Maintenez pour verrouiller", 700, ()=>send(val)));
  }
  else if(u.type==="sliders"){
    const vals=u.targets.map(()=>50);
    u.targets.forEach((tg,i)=>{
      const sl=el("div","slider");
      const mark=el("div","mark"); mark.style.left=tg+"%"; sl.appendChild(mark);
      const knob=el("div","knob"); sl.appendChild(knob);
      const val=el("div","val"); sl.appendChild(val);
      const place=()=>{ knob.style.left="calc("+vals[i]+"% - 13px)"; val.textContent=vals[i];
        val.style.color=Math.abs(vals[i]-tg)<=u.tol? "var(--lichen)":"var(--dim)";
        knob.style.background=Math.abs(vals[i]-tg)<=u.tol? "var(--lichen)":"var(--amber)"; };
      let on=false;
      const at=ev=>{ const r=sl.getBoundingClientRect();
        vals[i]=Math.max(0,Math.min(100,Math.round((ev.clientX-r.left)/r.width*100))); place(); };
      sl.addEventListener("pointerdown",ev=>{ on=true; at(ev); ev.preventDefault();
        try{ sl.setPointerCapture(ev.pointerId); }catch(e){} });
      sl.addEventListener("pointermove",ev=>{ if(on) at(ev); });
      ["pointerup","pointercancel"].forEach(e=>sl.addEventListener(e,()=>on=false));
      place(); body.appendChild(sl);
    });
    body.appendChild(UI.lever("Maintenez pour valider", 700, ()=>send(vals)));
  }
  else if(u.type==="lever"){
    const band=el("div","band");
    const zone=el("div","zone"); const grip=el("div","grip");
    band.appendChild(zone); band.appendChild(grip); body.appendChild(band);
    const bar=el("div","bar"); const fl=el("div"); fl.style.width="0%"; fl.style.background="var(--lichen)";
    bar.appendChild(fl); body.appendChild(bar);
    const info=el("div","note center","maintenez le levier dans la fen\u00eatre"); body.appendChild(info);
    let pos=50, zc=50, dir=1, held=0, last=performance.now(), on=false, raf=null;
    const at=ev=>{ const r=band.getBoundingClientRect();
      pos=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100)); };
    band.addEventListener("pointerdown",ev=>{ on=true; at(ev); ev.preventDefault();
      try{ band.setPointerCapture(ev.pointerId); }catch(e){} });
    band.addEventListener("pointermove",ev=>{ if(on) at(ev); });
    ["pointerup","pointercancel"].forEach(e=>band.addEventListener(e,()=>on=false));
    const loop=()=>{
      const now=performance.now(), dt=Math.min(100,now-last); last=now;
      zc+=dir*u.speed*dt/100;
      if(zc<u.width/2){ zc=u.width/2; dir=1; } if(zc>100-u.width/2){ zc=100-u.width/2; dir=-1; }
      zone.style.left=(zc-u.width/2)+"%"; zone.style.width=u.width+"%";
      grip.style.left="calc("+pos+"% - 7px)";
      const inside = on && Math.abs(pos-zc)<=u.width/2;
      band.classList.toggle("bad", !inside);
      if(inside) held+=dt/1000; else held=Math.max(0, held-dt/1600);
      fl.style.width=Math.min(100,held/u.hold*100)+"%";
      if(held>=u.hold){ cancelAnimationFrame(raf); send("ok"); return; }
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
    this.pzExtra=()=>cancelAnimationFrame(raf);
  }
  else if(u.type==="stroop"){
    const disp=el("div","cell big"); disp.style.cssText="font-size:34px;padding:26px 6px;cursor:default;letter-spacing:.1em";
    body.appendChild(disp);
    const prog=el("div","note center"); body.appendChild(prog);
    const g=grid(4); const got=[];
    u.names.forEach((nm,i)=>{ const c=el("div","cell big"," ");
      c.style.background=u.hex[i]; c.style.borderColor=u.hex[i];
      c.onclick=()=>{ got.push(i); SND.play("clic");
        if(got.length===u.list.length) send(got); else show(); };
      g.appendChild(c); });
    const show=()=>{ const r=u.list[got.length];
      disp.textContent=u.names[r.w]; disp.style.color=u.hex[r.c];
      prog.textContent=(got.length+1)+" / "+u.list.length; };
    body.appendChild(g); show();
  }
  else if(u.type==="expr"){
    const line=el("div","code-big"); line.style.cssText="font-size:24px;min-height:40px;letter-spacing:.1em";
    body.appendChild(line);
    const goal=el("div","note center","cible : "+u.target); body.appendChild(goal);
    const tokens=[]; const used=new Array(u.nums.length).fill(false);
    const paint=()=>{ line.textContent=tokens.join(" ");
      cells.forEach((c,i)=>c.className="cell big"+(used[i]?" ok":"")); };
    const g=grid(Math.min(u.nums.length,4)); const cells=[];
    u.nums.forEach((v,i)=>{ const c=el("div","cell big",String(v));
      c.onclick=()=>{ if(used[i] || tokens.length%2===1) return; used[i]=true; tokens.push(v); paint(); };
      cells.push(c); g.appendChild(c); });
    body.appendChild(g);
    const go=grid(u.ops.length+2);
    u.ops.forEach(op=>{ const c=el("div","cell big",op);
      c.onclick=()=>{ if(tokens.length===0 || tokens.length%2===0) return; tokens.push(op==="-"?"\u2212":op); paint(); };
      go.appendChild(c); });
    const undo=el("div","cell","effacer");
    undo.onclick=()=>{ tokens.length=0; used.fill(false); paint(); };
    const ok=el("div","cell","valider");
    ok.onclick=()=>send(tokens.map(t=>t==="\u2212"?"-":t));
    go.appendChild(undo); go.appendChild(ok); body.appendChild(go);
    paint();
  }
  else if(u.type==="bins"){
    const pool=el("div","inv"); pool.style.minHeight="46px"; body.appendChild(pool);
    const bins=el("div"); bins.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px";
    const answer={}; const boxes=[];
    [u.A,u.B].forEach((lab,bi)=>{ const b=el("div","drop"); b.style.minHeight="90px";
      b.appendChild(el("div","eyebrow",lab)); b.dataset.bin=bi; boxes.push(b); bins.appendChild(b); });
    body.appendChild(bins);
    u.items.forEach((lab,i)=>{
      const it=el("div","item"); it.appendChild(el("span","",lab));
      it.addEventListener("pointerdown", ev=>{
        ev.preventDefault();
        const gh=el("div"); gh.id="ghost"; gh.textContent=lab; document.body.appendChild(gh);
        it.classList.add("dragging");
        const mv=e=>{ gh.style.left=e.clientX+"px"; gh.style.top=e.clientY+"px";
          boxes.forEach(b=>b.classList.remove("hot"));
          const t=document.elementFromPoint(e.clientX,e.clientY);
          const b=t&&t.closest? t.closest(".drop"):null; if(b) b.classList.add("hot"); };
        const up=e=>{ document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up);
          gh.remove(); it.classList.remove("dragging"); boxes.forEach(b=>b.classList.remove("hot"));
          const t=document.elementFromPoint(e.clientX,e.clientY);
          const b=t&&t.closest? t.closest(".drop"):null; if(!b) return;
          answer[i]=+b.dataset.bin; b.appendChild(it); SND.play("pose");
          if(Object.keys(answer).length===u.items.length)
            setTimeout(()=>send(u.items.map((_,k)=>answer[k])),200); };
        document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up); mv(ev); });
      pool.appendChild(it); });
  }
  else if(u.type==="recall"){
    const box=el("div","quest"); box.textContent=u.list.join("    "); box.style.fontSize="19px"; body.appendChild(box);
    const q=el("div","note center","m\u00e9morisez\u2026"); body.appendChild(q);
    setTimeout(()=>{
      box.textContent="\u2014 liste effac\u00e9e \u2014"; box.style.color="var(--dim)";
      q.textContent="Quel \u00e9tait le "+(u.ask===1?"1er":u.ask+"e")+" code de la liste ?";
      const g=grid(2);
      u.options.forEach((o,i)=>{ const c=el("div","cell big",o);
        c.onclick=()=>{ c.classList.add("sel"); send(i); }; g.appendChild(c); });
      body.appendChild(g);
    }, u.show);
  }
  else if(u.type==="chase"){
    const box=el("div"); box.style.cssText="position:relative;height:210px;background:var(--panel2);border:1px solid var(--line);touch-action:none;overflow:hidden";
    const dot=el("div"); dot.style.cssText="position:absolute;width:"+(u.rad*2)+"px;height:"+(u.rad*2)+"px;border-radius:50%;background:var(--amber);transform:translate(-50%,-50%)";
    box.appendChild(dot); body.appendChild(box);
    const bar=el("div","bar"); const fl=el("div"); fl.style.cssText="width:0%;background:var(--lichen)"; bar.appendChild(fl); body.appendChild(bar);
    body.appendChild(el("div","note center","gardez le doigt sur le disque"));
    let x=50,y=50,vx=(rnd?1:1),vy=1, held=0, last=performance.now(), px=-99,py=-99, on=false, raf=null;
    vx=(Math.random()<.5?-1:1); vy=(Math.random()<.5?-1:1);
    const pt=e=>{ const r=box.getBoundingClientRect(); px=(e.clientX-r.left)/r.width*100; py=(e.clientY-r.top)/r.height*100; };
    box.addEventListener("pointerdown",e=>{ on=true; pt(e); e.preventDefault();
      try{ box.setPointerCapture(e.pointerId); }catch(err){} });
    box.addEventListener("pointermove",e=>{ if(on) pt(e); });
    ["pointerup","pointercancel"].forEach(ev=>box.addEventListener(ev,()=>on=false));
    const loop=()=>{
      const now=performance.now(), dt=Math.min(100,now-last); last=now;
      x+=vx*u.speed*dt/1000; y+=vy*u.speed*dt/1000;
      if(x<6){x=6;vx=Math.abs(vx);} if(x>94){x=94;vx=-Math.abs(vx);}
      if(y<10){y=10;vy=Math.abs(vy);} if(y>90){y=90;vy=-Math.abs(vy);}
      if(Math.random()<0.02){ vx=(Math.random()*2-1)*1.4; vy=(Math.random()*2-1)*1.4; }
      dot.style.left=x+"%"; dot.style.top=y+"%";
      const near = on && Math.hypot(px-x, (py-y)*0.55) < u.rad*0.75;
      dot.style.background = near? "var(--lichen)" : "var(--amber)";
      if(near) held+=dt/1000; else held=Math.max(0, held-dt/1400);
      fl.style.width=Math.min(100,held/u.hold*100)+"%";
      if(held>=u.hold){ cancelAnimationFrame(raf); send("ok"); return; }
      raf=requestAnimationFrame(loop); };
    raf=requestAnimationFrame(loop);
    this.pzExtra=()=>cancelAnimationFrame(raf);
  }
  else body.appendChild(el("div","note","\u00c9preuve inconnue."));
};
["pointerdown","keydown"].forEach(e=>document.addEventListener(e, function once(){
  SND.init(); SND.resume(); document.removeEventListener(e, once);
}));
UI.render();
</script>
